<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Utilisateurs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-guard.js"></script>

<style>
:root{
    --bg:#d8d8d3;
    --card:#eeeeea;
    --card2:#f6f6f2;
    --line:#8d8d86;
    --txt:#1d1d1b;

*{

}

body{

    padding:18px;
}

.wrap{

    margin:auto;
}

.card{

    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
}

h2{
    display:flex;
    gap:8px;
    margin:0 0 16px;
    font-size:22px;
}

.dot{

    height:10px;

    margin-top:7px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.section{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
}

label{
    display:block;
    margin:10px 0 6px;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:white;
    font-size:15px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.btn{
    flex:1;
    border:none;
    border-radius:12px;
    background:#1d1d1b;
    color:white;
    padding:12px;
    font-weight:800;
    cursor:pointer;
}

.btn.secondary{
    background:var(--card2);
    color:var(--txt);
    border:1px solid var(--line);
}

.users-title{
    margin:0 0 12px;
    font-size:18px;
}

.item{
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-top:10px;
}

.email{
    font-weight:800;
    margin-bottom:5px;
}

.role{
    color:var(--muted);
    font-size:13px;
}

.created{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

@media(max-width:860px){

        grid-template-columns:1fr;
    }

}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.hub-btn{
    border:1px solid var(--line);
    background:var(--card2);
    color:var(--txt);
    border-radius:999px;
    padding:10px 18px;
    text-decoration:none;
    font-weight:800;
    cursor:pointer;
}

.hub-btn:hover{
    background:white;
}
.hub-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    height:40px;
    padding:0 16px;

    border:1px solid var(--line);
    border-radius:999px;

    background:var(--card2);

    color:var(--txt);

    text-decoration:none;

    font-size:20px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.hub-btn:hover{
    background:white;
}

.password-display{
    font-family:Consolas,Monaco,monospace;
    font-size:16px;
    font-weight:900;
    color:#1d1d1b;
    background:#f6f6f2;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    margin-top:6px;
}
    
</style>
    
</head>

<body>

<div class="wrap">

    <a

    <span class="hub-icon">🏠</span>
    Hub

</a>

</div>


<div class="layout">

    <!-- Création utilisateur -->

    <div class="section">

        <h3>Création utilisateur</h3>

        <input id="email">

        <label>Rôle</label>

<select id="role">
    <option value="user">Utilisateur</option>
    <option value="expert_machine">Expert Machine</option>

<select id="laserMachine">

</select>

<label>Machine Hot Stamping</label>
<select id="hotMachine">

</select>

        <input id="password" readonly>

       <div class="actions">

    <button
        id="createBtn"
        class="btn">

        Créer utilisateur

</div>


    </div>

    <!-- Liste utilisateurs -->

            Utilisateurs

<div

    <div class="created">

        <br><br>

        Mot de passe :

    <div

        margin-top:12px;

</div>

</div>
<script>

const SUPABASE_URL =
'https://erzuvpswagzwlrxgctaj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function generatePassword(){

    const chars =
        'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$';

    let pwd = '';

    for(let i=0;i<12;i++){

        pwd += chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

    }

    document.getElementById('password').value =
        pwd;

}

async function loadMachines(){

    await loadMachineTable(
        'laser_machines',
        'laserMachine'
    );

    await loadMachineTable(
        'cnc_machines',
        'cncMachine'
    );

    await loadMachineTable(
        'hot_machines',
        'hotMachine'
    );

}

async function loadMachineTable(
    table,
    selectId
){

    const { data, error } =
        await sb
            .from(table)
            .select('id,name')
            .order('name');

    if(error){
        console.error(error);
        return;
    }

    const sel =
        document.getElementById(selectId);

    data.forEach(machine=>{

        const opt =
            document.createElement('option');

        opt.value = machine.id;
        opt.textContent = machine.name;

        sel.appendChild(opt);

    });

}
    
async function loadUsers(){

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    if(!session){
        return;
    }

    const r = await fetch(

        SUPABASE_URL +
        '/rest/v1/user_roles?select=*&order=email.asc',

        {
            headers:{
                apikey:SUPABASE_KEY,
                Authorization:
                    'Bearer ' + session.access_token
            }
        }

    );

    const rows =
        await r.json();

    const users =
        document.getElementById(
            'users'
        );

    users.innerHTML = '';

    rows.forEach(user=>{

        const div =
            document.createElement(
                'div'
            );

        div.className =
            'item';

        div.innerHTML = `

    <div class="email">
        ${user.email}
    </div>

    <div class="role">
        ${user.role}
    </div>

    <div class="created">
        Créé le :
        ${
            user.created_at
            ? new Date(
                user.created_at
            ).toLocaleDateString(
                'fr-FR'
            )
            : '-'
        }
    </div>

    <div style="
        display:flex;
        gap:8px;
        margin-top:12px;
        flex-wrap:wrap;
    ">

        <button
            class="role-btn"
            data-user-id="${user.user_id}"
            data-email="${user.email}">

            🛡️ Modifier rôle

        </button>

        <button
            class="pwd-btn"
            data-user-id="${user.user_id}"
            data-email="${user.email}">

            🔑 Réinitialiser MDP

        </button>

        <button
    class="delete-btn"
    data-user-id="${user.user_id}"
    data-email="${user.email}"
    data-role="${user.role}">

    🗑️ Supprimer utilisateur

</button>

    </div>

`;

        users.appendChild(div);

const roleBtn =
    div.querySelector('.role-btn');

if(roleBtn){

    roleBtn.onclick =
    async()=>{

        await changeUserRole(
            user.user_id,
            user.email,
            user.role
        );

    };

}


const pwdBtn =
    div.querySelector('.pwd-btn');

if(pwdBtn){

    pwdBtn.onclick =
        async()=>{

            await resetUserPassword(
                user.user_id,
                user.email
            );

        };

}

const deleteBtn =
    div.querySelector('.delete-btn');

if(deleteBtn){

    deleteBtn.onclick =
        async()=>{

            await deleteUser(
                user.user_id,
                user.email,
                user.role
            );

        };

}

    });

}

/* =========================================================
   GÉNÉRATION D'UN MOT DE PASSE SÉCURISÉ
   ========================================================= */

function createRandomPassword(){

    const upper =
        'ABCDEFGHJKLMNPQRSTUVWXYZ';

    const lower =
        'abcdefghijkmnopqrstuvwxyz';

    const numbers =
        '23456789';

    const symbols =
        '!@#$%';


    const allCharacters =
        upper +
        lower +
        numbers +
        symbols;


    let password =

        upper[
            Math.floor(
                Math.random() *
                upper.length
            )
        ] +

        lower[
            Math.floor(
                Math.random() *
                lower.length
            )
        ] +

        numbers[
            Math.floor(
                Math.random() *
                numbers.length
            )
        ] +

        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    while(password.length < 14){

        password +=

            allCharacters[
                Math.floor(
                    Math.random() *
                    allCharacters.length
                )
            ];

    }


    /*
       Mélange les caractères.
    */

    return password

        .split('')

        .sort(
            () =>
                Math.random() - 0.5
        )

        .join('');

}


/* =========================================================
   APPEL DE L'EDGE FUNCTION ADMINISTRATEUR
   ========================================================= */

async function callAdminManageUser(
    requestBody
){

    const session =
        (
            await sb.auth.getSession()
        ).data.session;


    if(!session){

        throw new Error(
            'Session administrateur expirée. Reconnecte-toi.'
        );

    }


    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-manage-user',

            {
                method:
                    'POST',

                headers:{

                    'Content-Type':
                        'application/json',

                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        'Bearer ' +
                        session.access_token

                },

                body:
                    JSON.stringify(
                        requestBody
                    )
            }

        );


    let result = {};


    try{

        result =
            await response.json();

    }catch(error){

        console.error(
            'Réponse admin-manage-user invalide',
            error
        );

    }


    if(!response.ok){

        throw new Error(

            result.error ||

            result.details ||

            'Opération administrateur impossible'

        );

    }


    return result;

}

/* =========================================================
   CHANGEMENT DU RÔLE
   ========================================================= */

async function resetUserPassword(
    userId,
    email
){

    const confirmed =
        confirm(

`Réinitialiser le mot de passe ?

Utilisateur :
${email}

L'ancien mot de passe ne fonctionnera plus.

Le compte et son historique seront conservés.`

        );

    if(!confirmed){
        return;
    }

    const newPassword =
        createRandomPassword();

    try{

        await callAdminManageUser({

            action:
                'reset-password',

            userId:
                userId,

            password:
                newPassword

        });

        showCredentials(
        email,
        newPassword
);
        
        alert(

`Mot de passe réinitialisé

Email :
${email}

Nouveau mot de passe :
${newPassword}`

        );

    }catch(error){

        console.error(
            'resetUserPassword',
            error
        );

        alert(
            error.message
        );

    }

}

async function changeUserRole(
    userId,
    email,
    currentRole
){

    const enteredRole =
    prompt(
`Modifier le rôle de :

${email}

Rôles autorisés :

user
expert_machine
expert_global
admin`,
        currentRole || 'user'
    );

    if(enteredRole === null){
        return;
    }

    const newRole =
        enteredRole
            .trim()
            .toLowerCase();

    if(
    ![
        'user',
        'expert_machine',
        'expert_global',
        'admin'
    ].includes(newRole)
){
    alert('Rôle invalide');
    return;
}

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-manage-user',

            {

                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json',

                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        'Bearer ' +
                        session.access_token
                },

                body:JSON.stringify({

                    action:'change-role',
                    userId:userId,
                    role:newRole

                })

            }

        );

    const result =
        await response.json();

    if(!response.ok){

        alert(
            result.error ||
            'Erreur'
        );

        return;

    }

    alert(
        'Rôle modifié avec succès'
    );

    await loadUsers();

}

    /* =========================================================
   SUPPRESSION D'UN UTILISATEUR
   ========================================================= */

async function deleteUser(
    userId,
    email,
    userRole
){

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    if(!session){

        alert(
            'Session administrateur expirée. Reconnecte-toi.'
        );

        return;

    }

    /*
       Protection :
       l'administrateur connecté ne peut pas
       supprimer son propre compte.
    */

    if(
        session.user.id === userId
    ){

        alert(
`Suppression impossible

Tu ne peux pas supprimer ton propre compte administrateur.`
        );

        return;

    }

    const confirmed =
        confirm(
`⚠️ Supprimer définitivement cet utilisateur ?

Utilisateur :
${email}

Rôle :
${userRole || '-'}

Cette action supprimera :
• le compte de connexion ;
• le rôle de l'utilisateur ;
• son accès au Manufacturing Tools Hub.

Cette action est irréversible.`
        );

    if(!confirmed){
        return;
    }

    /*
       Deuxième confirmation pour éviter
       une suppression accidentelle.
    */

    const finalConfirmation =
        prompt(
`Pour confirmer la suppression, saisissez exactement :

Supprimer`
        );

    if(
        finalConfirmation !==
        'Supprimer'
    ){

        if(finalConfirmation !== null){

            alert(
                'Suppression annulée : confirmation incorrecte.'
            );

        }

        return;

    }

    try{

        await callAdminManageUser({

            action:
                'delete-user',

            userId:
                userId

        });

        alert(
`Utilisateur supprimé avec succès

${email}

Le compte ne peut désormais plus se connecter au Manufacturing Tools Hub.`
        );

        await loadUsers();

    }catch(error){

        console.error(
            'deleteUser',
            error
        );

        alert(
            error.message ||
            'Suppression utilisateur impossible'
        );

    }

}

async function createUser(){

    const email =
        document
            .getElementById('email')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    const role =
        document
            .getElementById('role')
            .value;

    if(!email){

        alert(
            'Adresse email obligatoire'
        );

        return;

    }

    if(!password){

        alert(
            'Génère un mot de passe'
        );

        return;

    }

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    if(!session){

        alert(
            'Session expirée'
        );

        return;

    }

    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-create-user',

            {

                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json',

                    Authorization:
                        'Bearer ' +
                        session.access_token
                },

                body:JSON.stringify({

                    email,
                    password,
                    role

                })

            }

        );

    const result =
        await response.json();

    if(!response.ok){

        alert(
            result.error ||
            'Erreur'
        );

        return;

    }

    showCredentials(
    email,
    password
);
    
    alert(
`Utilisateur créé avec succès

Email :
${email}

Mot de passe :
${password}

⚠️ Copiez ces informations avant de fermer cette fenêtre.`
);

    document
        .getElementById('email')
        .value = '';

    generatePassword();

    await loadUsers();

}

.getElementById(

)
.onclick =
createUser;

Votre accès Manufacturing Tools Hub est disponible.

Adresse email :
${document.getElementById('lastEmail').textContent}

Mot de passe :
${document.getElementById('lastPassword').textContent}

Lien :
https://manufacturing-tools-hub.vercel.app`;

    const password =
        document.getElementById(
            'lastPassword'

    const mailText =

`Bonjour,

Votre accès Manufacturing Tools Hub est disponible.

Adresse email :
${email}

Mot de passe :
${password}

Lien :
https://manufacturing-tools-hub.vercel.app

Applications disponibles :

• CNC Calculator
• Hot Stamping Calculator
• Laser Calculator

En cas de perte ou d'oubli du mot de passe, contactez un administrateur.

    await navigator.clipboard.writeText(

window.authReady.then(
async()=>{

    const role =
        await window
        .appAuth
        .getRole();

    if(role !== 'admin'){

        alert(
            'Accès réservé aux administrateurs'
        );

        location.href='/';

        return;

    }

    generatePassword();

    await loadMachines();
    await loadUsers();

});

</script>
