<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Utilisateurs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-guard.js"></script>

<style>
:root{
    --bg:#d8d8d3;
    --card:#eeeeea;
    --card2:#f6f6f2;
    --line:#8d8d86;
    --txt:#1d1d1b;
    --muted:#5f5f58;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:18px;
}

.wrap{
    max-width:1200px;
    margin:auto;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
}

h2{
    display:flex;
    gap:8px;
    margin:0 0 16px;
    font-size:22px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#1d1d1b;
    margin-top:7px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.section{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
}

label{
    display:block;
    margin:10px 0 6px;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:white;
    font-size:15px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.btn{
    flex:1;
    border:none;
    border-radius:12px;
    background:#1d1d1b;
    color:white;
    padding:12px;
    font-weight:800;
    cursor:pointer;
}

.btn.secondary{
    background:var(--card2);
    color:var(--txt);
    border:1px solid var(--line);
}

.users-title{
    margin:0 0 12px;
    font-size:18px;
}

.item{
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-top:10px;
}

.email{
    font-weight:800;
    margin-bottom:5px;
}

.role{
    color:var(--muted);
    font-size:13px;
}

.created{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

@media(max-width:860px){

    .layout{
        grid-template-columns:1fr;
    }

}

</style>
    
</head>

<body>

<div class="wrap">

<div class="card">

<h2>
    <span class="dot"></span>
    Gestion Utilisateurs
</h2>

<div class="layout">

    <!-- Création utilisateur -->

    <div class="section">

        <h3>Création utilisateur</h3>

        <label>Adresse email</label>
        <input id="email">

        <label>Rôle</label>

        <select id="role">
            <option value="user">User</option>
            <option value="expert">Expert</option>
            <option value="admin">Admin</option>
        </select>

        <label>Mot de passe généré</label>
        <input id="password" readonly>

        <div class="actions">

            <button
                id="generateBtn"
                class="btn secondary">

                Générer

            </button>

            <button
                id="createBtn"
                class="btn">

                Créer utilisateur

            </button>

        </div>

    </div>

    <!-- Liste utilisateurs -->

    <div class="section">

        <h3 class="users-title">
            Utilisateurs
        </h3>

        <div id="users"></div>

    </div>

</div>

</div>

</div>
<script>

const SUPABASE_URL =
'https://erzuvpswagzwlrxgctaj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function generatePassword(){

    const chars =
        'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$';

    let pwd = '';

    for(let i=0;i<12;i++){

        pwd += chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

    }

    document.getElementById('password').value =
        pwd;

}

async function loadUsers(){

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    if(!session){
        return;
    }

    const r = await fetch(

        SUPABASE_URL +
        '/rest/v1/user_roles?select=*&order=email.asc',

        {
            headers:{
                apikey:SUPABASE_KEY,
                Authorization:
                    'Bearer ' + session.access_token
            }
        }

    );

    const rows =
        await r.json();

    const users =
        document.getElementById(
            'users'
        );

    users.innerHTML = '';

    rows.forEach(user=>{

        const div =
            document.createElement(
                'div'
            );

        div.className =
            'item';

        div.innerHTML = `

    <div class="email">
        ${user.email}
    </div>

    <div class="role">
        ${user.role}
    </div>

    <div class="created">
        Créé le :
        ${
            user.created_at
            ? new Date(
                user.created_at
            ).toLocaleDateString(
                'fr-FR'
            )
            : '-'
        }
    </div>

    <div style="
        display:flex;
        gap:8px;
        margin-top:12px;
        flex-wrap:wrap;
    ">

        <button
            class="role-btn"
            data-user-id="${user.user_id}"
            data-email="${user.email}">

            🛡️ Modifier rôle

        </button>

        <button
            class="pwd-btn"
            data-user-id="${user.user_id}"
            data-email="${user.email}">

            🔑 Réinitialiser MDP

        </button>

    </div>

`;

        users.appendChild(div);

const roleBtn =
    div.querySelector('.role-btn');

if(roleBtn){

    roleBtn.onclick =
    async()=>{

        await changeUserRole(
            user.user_id,
            user.email,
            user.role
        );

    };

}


const pwdBtn =
    div.querySelector('.pwd-btn');

if(pwdBtn){

    pwdBtn.onclick =
        async()=>{

            await resetUserPassword(
                user.user_id,
                user.email
            );

        };

}

    });

}

/* =========================================================
   GÉNÉRATION D'UN MOT DE PASSE SÉCURISÉ
   ========================================================= */

function createRandomPassword(){

    const upper =
        'ABCDEFGHJKLMNPQRSTUVWXYZ';

    const lower =
        'abcdefghijkmnopqrstuvwxyz';

    const numbers =
        '23456789';

    const symbols =
        '!@#$%';


    const allCharacters =
        upper +
        lower +
        numbers +
        symbols;


    let password =

        upper[
            Math.floor(
                Math.random() *
                upper.length
            )
        ] +

        lower[
            Math.floor(
                Math.random() *
                lower.length
            )
        ] +

        numbers[
            Math.floor(
                Math.random() *
                numbers.length
            )
        ] +

        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    while(password.length < 14){

        password +=

            allCharacters[
                Math.floor(
                    Math.random() *
                    allCharacters.length
                )
            ];

    }


    /*
       Mélange les caractères.
    */

    return password

        .split('')

        .sort(
            () =>
                Math.random() - 0.5
        )

        .join('');

}


/* =========================================================
   APPEL DE L'EDGE FUNCTION ADMINISTRATEUR
   ========================================================= */

async function callAdminManageUser(
    requestBody
){

    const session =
        (
            await sb.auth.getSession()
        ).data.session;


    if(!session){

        throw new Error(
            'Session administrateur expirée. Reconnecte-toi.'
        );

    }


    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-manage-user',

            {
                method:
                    'POST',

                headers:{

                    'Content-Type':
                        'application/json',

                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        'Bearer ' +
                        session.access_token

                },

                body:
                    JSON.stringify(
                        requestBody
                    )
            }

        );


    let result = {};


    try{

        result =
            await response.json();

    }catch(error){

        console.error(
            'Réponse admin-manage-user invalide',
            error
        );

    }


    if(!response.ok){

        throw new Error(

            result.error ||

            result.details ||

            'Opération administrateur impossible'

        );

    }


    return result;

}

/* =========================================================
   CHANGEMENT DU RÔLE
   ========================================================= */

async function resetUserPassword(
    userId,
    email
){

    const confirmed =
        confirm(

`Réinitialiser le mot de passe ?

Utilisateur :
${email}

L'ancien mot de passe ne fonctionnera plus.

Le compte et son historique seront conservés.`

        );

    if(!confirmed){
        return;
    }

    const newPassword =
        createRandomPassword();

    try{

        await callAdminManageUser({

            action:
                'reset-password',

            userId:
                userId,

            password:
                newPassword

        });

        alert(

`Mot de passe réinitialisé

Email :
${email}

Nouveau mot de passe :
${newPassword}`

        );

    }catch(error){

        console.error(
            'resetUserPassword',
            error
        );

        alert(
            error.message
        );

    }

}

async function changeUserRole(
    userId,
    email,
    currentRole
){

    const enteredRole =
        prompt(
`Modifier le rôle de :

${email}

Rôles autorisés :
user
expert
admin`,
            currentRole || 'user'
        );

    if(enteredRole === null){
        return;
    }

    const newRole =
        enteredRole
            .trim()
            .toLowerCase();

    if(
        !['user','expert','admin']
        .includes(newRole)
    ){
        alert('Rôle invalide');
        return;
    }

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-manage-user',

            {

                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json',

                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        'Bearer ' +
                        session.access_token
                },

                body:JSON.stringify({

                    action:'change-role',
                    userId:userId,
                    role:newRole

                })

            }

        );

    const result =
        await response.json();

    if(!response.ok){

        alert(
            result.error ||
            'Erreur'
        );

        return;

    }

    alert(
        'Rôle modifié avec succès'
    );

    await loadUsers();

}

async function createUser(){

    const email =
        document
            .getElementById('email')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    const role =
        document
            .getElementById('role')
            .value;

    if(!email){

        alert(
            'Adresse email obligatoire'
        );

        return;

    }

    if(!password){

        alert(
            'Génère un mot de passe'
        );

        return;

    }

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    if(!session){

        alert(
            'Session expirée'
        );

        return;

    }

    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-create-user',

            {

                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json',

                    Authorization:
                        'Bearer ' +
                        session.access_token
                },

                body:JSON.stringify({

                    email,
                    password,
                    role

                })

            }

        );

    const result =
        await response.json();

    if(!response.ok){

        alert(
            result.error ||
            'Erreur'
        );

        return;

    }

    alert(
`Utilisateur créé avec succès

Email :
${email}

Mot de passe :
${password}

⚠️ Copiez ces informations avant de fermer cette fenêtre.`
);

    document
        .getElementById('email')
        .value = '';

    generatePassword();

    await loadUsers();

}

document
.getElementById(
    'generateBtn'
)
.onclick =
generatePassword;

document
.getElementById(
    'createBtn'
)
.onclick =
createUser;

window.authReady.then(
async()=>{

    const role =
        await window
        .appAuth
        .getRole();

    if(role !== 'admin'){

        alert(
            'Accès réservé aux administrateurs'
        );

        location.href='/';

        return;

    }

    generatePassword();

    await loadUsers();

});

</script>
</body>
</html>
