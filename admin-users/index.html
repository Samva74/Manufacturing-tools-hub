<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Utilisateurs</title>
<script src="../auth-guard.js"></script>
<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#d8d8d3;
    padding:30px;
}

.card{
    max-width:900px;
    margin:auto;
    background:#eeeeea;
    border:1px solid #8d8d86;
    border-radius:20px;
    padding:25px;
}

h1{
    margin-top:0;
}
</style>
</head>

<body>

<div class="card">

<h1>👤 Gestion Utilisateurs</h1>

<p>
Module Administration en cours de construction
</p>

<p>
Seuls les administrateurs ont accès à cette page.
</p>

</div>

<script>

window.authReady.then(async()=>{

    const role =
        await window.appAuth.getRole();

    if(role !== 'admin'){

        alert(
            'Accès réservé aux administrateurs'
        );

        location.href='/';

    }

});

</script>

</body>
</html>
