<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Utilisateurs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-guard.js"></script>

<style>
:root{
    --bg:#d8d8d3;
    --card:#eeeeea;
    --line:#8d8d86;
    --txt:#1d1d1b;
}

body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px;
}

.card{
    max-width:1000px;
    margin:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
}

h1{
    margin-top:0;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-top:6px;
}

button{
    padding:12px;
    border-radius:12px;
    border:none;
    background:#1d1d1b;
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.list{
    margin-top:30px;
}

.item{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="card">

<h1>👤 Gestion Utilisateurs</h1>

<div class="grid">

<div>

<label>Email</label>
<input id="email">

</div>

<div>

<label>Rôle</label>

<select id="role">
<option value="user">User</option>
<option value="expert">Expert</option>
<option value="admin">Admin</option>
</select>

</div>

</div>

<label>Mot de passe généré</label>

<input id="password" readonly>

<button id="generateBtn">
Générer un mot de passe
</button>

<button id="createBtn">
Créer utilisateur
</button>

<div class="list">

<h2>Utilisateurs</h2>

<div id="users"></div>

</div>

</div>

<script>

const SUPABASE_URL =
'https://erzuvpswagzwlrxgctaj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function generatePassword(){

    const chars =
        'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$';

    let pwd = '';

    for(let i=0;i<12;i++){

        pwd += chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

    }

    document.getElementById('password').value =
        pwd;

}

async function loadUsers(){

    const token =
        (
            await sb.auth.getSession()
        ).data.session?.access_token;

    const r = await fetch(

        SUPABASE_URL +
        '/rest/v1/user_roles?select=*' +
        '&order=email.asc',

        {
            headers:{
                apikey:SUPABASE_KEY,
                Authorization:
                    'Bearer ' + token
            }
        }

    );

    const rows =
        await r.json();

    const users =
        document.getElementById(
            'users'
        );

    users.innerHTML = '';

    rows.forEach(user=>{

        const div =
            document.createElement(
                'div'
            );

        div.className =
            'item';

        div.innerHTML =
            '<b>' +
            user.email +
            '</b><br>' +
            user.role;

        users.appendChild(div);

    });

}

async function createUser(){

    const email =
        document
            .getElementById('email')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    const role =
        document
            .getElementById('role')
            .value;

    if(!email){

        alert(
            'Adresse email obligatoire'
        );

        return;

    }

    if(!password){

        alert(
            'Génère un mot de passe'
        );

        return;

    }

    const session =
        (
            await sb.auth.getSession()
        ).data.session;

    const response =
        await fetch(

            SUPABASE_URL +
            '/functions/v1/admin-create-user',

            {

                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json',

                    Authorization:
                        'Bearer ' +
                        session.access_token
                },

                body:JSON.stringify({

                    email,
                    password,
                    role

                })

            }

        );

    const result =
        await response.json();

    if(!response.ok){

        alert(
            result.error ||
            'Erreur'
        );

        return;

    }

    alert(
        'Utilisateur créé'
    );

    loadUsers();

}

document
.getElementById(
    'generateBtn'
)
.onclick =
generatePassword;

document
.getElementById(
    'createBtn'
)
.onclick =
createUser;

window.authReady.then(
async()=>{

    const role =
        await window
        .appAuth
        .getRole();

    if(role !== 'admin'){

        alert(
            'Accès réservé aux administrateurs'
        );

        location.href='/';

        return;

    }

    generatePassword();

    loadUsers();

});

</script>
</body>
</html>
