<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Utilisateurs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-guard.js"></script>

<style>
:root{
    --bg:#d8d8d3;
    --card:#eeeeea;
    --line:#8d8d86;
    --txt:#1d1d1b;
}

body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px;
}

.card{
    max-width:1000px;
    margin:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
}

h1{
    margin-top:0;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-top:6px;
}

button{
    padding:12px;
    border-radius:12px;
    border:none;
    background:#1d1d1b;
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.list{
    margin-top:30px;
}

.item{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="card">

<h1>👤 Gestion Utilisateurs</h1>

<div class="grid">

<div>

<label>Email</label>
<input id="email">

</div>

<div>

<label>Rôle</label>

<select id="role">
<option value="user">User</option>
<option value="expert">Expert</option>
<option value="admin">Admin</option>
</select>

</div>

</div>

<label>Mot de passe généré</label>

<input id="password" readonly>

<button id="generateBtn">
Générer un mot de passe
</button>

<button id="createBtn">
Créer utilisateur
</button>

<div class="list">

<h2>Utilisateurs</h2>

<div id="users"></div>

</div>

</div>

</body>
</html>
