  <header><div class="logo">M</div><div><b>MarquetryMaker Pro</b><div class="sub">Vectorisation, propositions de palettes et plans de découpe</div></div></header><main class="app">
<section class="stack"><div class="card"><div class="row between"><h2>Source image</h2><button id="browse" class="btn dark">Parcourir</button></div><div id="drop" class="drop"><div class="source"><img id="src"></div><div class="row between" style="margin-top:7px"><span class="mini">Image entière</span><span id="sourcePx" class="mini"></span></div></div><input id="file" type="file" accept="image/*" class="hidden"><div class="grid2" style="margin-top:12px"><div class="field"><label>Largeur mm</label><input id="widthMm" type="number" value="150"></div><div class="field"><label>Hauteur mm</label><input id="heightMm" type="number" value="100"></div></div><label class="row" style="margin-top:10px"><input id="keepRatio" type="checkbox" checked>Conserver les proportions</label></div>
<div class="card"><h2>Traitement</h2><div class="field"><label>Nombre d'essences</label><input id="count" class="slider" type="range" min="2" max="30" value="8"><div class="row between"><span>2</span><span id="countLabel" class="pill">8 essences</span><span>30</span></div></div><div class="field" style="margin-top:9px"><label>Qualité</label><input id="res" class="slider" type="range" min="120" max="1000" step="20" value="400"><div class="row between"><span>120</span><span id="resLabel" class="pill">400 px</span><span>1000</span></div></div><div class="field" style="margin-top:9px"><label>Lissage</label><input id="smooth" class="slider" type="range" min="0" max="6" value="2"></div><div class="field" style="margin-top:9px"><label>Surface mini d'une pièce</label><input id="minArea" class="slider" type="range" min="1" max="200" value="18"><div class="row between"><span>1</span><span id="areaLabel" class="pill">18 px</span><span>200</span></div></div></div></section>
<section class="stack"><div class="card"><div class="row between"><h2>Prévisualisation vectorisée</h2><span id="selectedName" class="pill"></span></div><div id="preview" class="preview"><canvas id="canvas"></canvas><span id="info" class="tag"></span></div></div><div class="card"><h2>Choix de la palette</h2><select id="paletteSelect" style="width:100%;padding:11px;border:1px solid #d8dce2;border-radius:9px;background:#fff;font:inherit"></select><div id="paletteDescription" class="mini" style="margin-top:8px"></div><div id="paletteSummary" class="swatches" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:7px"></div></div></section>
<section class="stack"><div class="card"><h2>Export & fichiers</h2><button id="planPng" class="btn dark wide">Télécharger plan PNG</button><button id="palettePng" class="btn light wide" style="margin-top:8px">Palette PNG</button><button id="txt" class="btn light wide" style="margin-top:8px">Fiche TXT</button><button id="svg" class="btn light wide" style="margin-top:8px">SVG par zones</button><button id="indexedPng" class="btn light wide" style="margin-top:8px">Plan indexé PNG</button></div><div class="card"><h2>Fiche marqueterie</h2><pre id="sheet" class="code"></pre></div></section></main><script>
const woods=[{"name": "Chêne", "color": "#A47C48"}, {"name": "Hêtre", "color": "#C9A36A"}, {"name": "Frêne", "color": "#D0B27B"}, {"name": "Noyer", "color": "#5A3A24"}, {"name": "Érable", "color": "#E1C58F"}, {"name": "Bouleau", "color": "#D8BE86"}, {"name": "Merisier", "color": "#9A5A3B"}, {"name": "Orme", "color": "#9B704A"}, {"name": "Châtaignier", "color": "#8C6038"}, {"name": "Pin", "color": "#D6AD63"}, {"name": "Épicéa", "color": "#D9BA79"}, {"name": "Sapin", "color": "#D7B577"}, {"name": "Mélèze", "color": "#B9824F"}, {"name": "Cèdre", "color": "#A76443"}, {"name": "Douglas", "color": "#B77545"}, {"name": "Teck", "color": "#8B5E35"}, {"name": "Acajou", "color": "#713B2C"}, {"name": "Iroko", "color": "#8A6338"}, {"name": "Sipo", "color": "#7C4634"}, {"name": "Padouk", "color": "#8F321F"}, {"name": "Wengé", "color": "#33251F"}, {"name": "Zebrano", "color": "#A87443"}, {"name": "Ébène", "color": "#211D1A"}, {"name": "Bambou", "color": "#CFB36F"}, {"name": "Olivier", "color": "#9C7944"}, {"name": "Acacia", "color": "#976238"}, {"name": "Peuplier", "color": "#D7C399"}, {"name": "Tilleul", "color": "#DCC89E"}, {"name": "Aulne", "color": "#B87B54"}, {"name": "OSB", "color": "#A77A45"}];const $=id=>document.getElementById(id);let source=null,ratio=1,w=0,h=0,raw=null,labels=null,regions=[],proposals=[],active=0;
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}function canvasDl(c,n){c.toBlob(b=>dl(b,n),'image/png')}function rgb(v){return[v.slice(1,3),v.slice(3,5),v.slice(5,7)].map(x=>parseInt(x,16))}function lum(o){const c=rgb(o.color);return c[0]*.2126+c[1]*.7152+c[2]*.0722}
function demo(){const c=document.createElement('canvas');c.width=900;c.height=600;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,900,600);g.addColorStop(0,'#eed9ae');g.addColorStop(.45,'#9a7050');g.addColorStop(1,'#281c18');x.fillStyle=g;x.fillRect(0,0,900,600);x.fillStyle='#d8bd82';x.beginPath();x.arc(450,300,145,0,Math.PI*2);x.fill();return c.toDataURL('image/jpeg',.92)}
function read(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{source=r.result;$('src').src=source;process()};r.readAsDataURL(f)}$('browse').onclick=e=>{e.stopPropagation();$('file').click()};$('drop').onclick=()=>$('file').click();$('file').onchange=e=>read(e.target.files[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();read(e.dataTransfer.files[0])};
function nearestScore(wood){const c=rgb(wood.color);let best=1e12;for(let i=0;i<raw.length;i+=Math.max(4,Math.floor(raw.length/14000)*4)){const d=(raw[i]-c[0])**2+(raw[i+1]-c[1])**2+(raw[i+2]-c[2])**2;if(d<best)best=d}return best}
function spreadByLuminance(list,n){const sorted=[...list].sort((a,b)=>lum(a)-lum(b)),out=[];if(n===1)return[sorted[Math.floor(sorted.length/2)]];for(let i=0;i<n;i++)out.push(sorted[Math.round(i*(sorted.length-1)/(n-1))]);return [...new Set(out)]}
function contrastMix(base,n){const pool=[...woods].sort((a,b)=>lum(a)-lum(b)),selected=[];const candidates=[pool[0],pool[pool.length-1],...base,...spreadByLuminance(pool,n)];for(const wood of candidates){if(!wood||selected.includes(wood))continue;const L=lum(wood);if(selected.length<2||selected.every(x=>Math.abs(lum(x)-L)>Math.max(5,65/n)))selected.push(wood);if(selected.length===n)break}for(const wood of pool)if(selected.length<n&&!selected.includes(wood))selected.push(wood);return selected.slice(0,n)}
function tonalLuxury(base,n,minLum,maxLum){let pool=base.filter(w=>lum(w)>=minLum&&lum(w)<=maxLum);if(pool.length<n){const target=(minLum+maxLum)/2;pool=[...base].sort((a,b)=>Math.abs(lum(a)-target)-Math.abs(lum(b)-target))}return contrastMix(pool,n)}
function makeProposals(n){
 const realisticBase=woods.map(x=>({x,s:nearestScore(x)})).sort((a,b)=>a.s-b.s).map(o=>o.x);
 const contrastBase=spreadByLuminance(woods,n);
 const fabricationBase=[...woods].sort((a,b)=>Math.abs(lum(a)-128)-Math.abs(lum(b)-128));
 const luxuryNames=['Ébène','Wengé','Olivier','Zebrano','Padouk','Acajou','Noyer','Érable','Teck','Iroko','Merisier','Chêne','Frêne','Bouleau','Bambou','Cèdre','Sipo','Orme','Aulne','Acacia','Châtaignier','Mélèze','Douglas','Tilleul','Hêtre','Peuplier','Pin','Sapin','Épicéa','OSB'];
 const luxuryBase=luxuryNames.map(name=>woods.find(w=>w.name===name)).filter(Boolean);
 return[
  {name:'Réalisme',desc:'Essences proches des couleurs de l’image, avec un contraste renforcé.',woods:contrastMix(realisticBase,n)},
  {name:'Contraste',desc:'Séparation maximale entre essences claires, intermédiaires et foncées.',woods:contrastMix(contrastBase,n)},
  {name:'Fabrication',desc:'Palette lisible conçue pour faciliter le repérage et la découpe.',woods:contrastMix(fabricationBase,n)},
  {name:'Luxe',desc:'Essences décoratives contrastées, inspirées de la sélection Luxe.',woods:contrastMix(luxuryBase,n)},
  {name:'Très clair',desc:'Sélection Luxe très claire, avec contrastes conservés dans les tons clairs.',woods:tonalLuxury(luxuryBase,n,150,255)},
  {name:'Clair',desc:'Sélection Luxe claire, équilibrée entre bois crème, beige et miel.',woods:tonalLuxury(luxuryBase,n,115,225)},
  {name:'Standard',desc:'Sélection Luxe équilibrée sur une plage claire, moyenne et foncée.',woods:tonalLuxury(luxuryBase,n,65,200)},
  {name:'Légèrement sombre',desc:'Sélection Luxe plus profonde, sans perdre la séparation entre les zones.',woods:tonalLuxury(luxuryBase,n,20,155)}
 ]
}
function assign(pal){const cs=pal.map(x=>rgb(x.color)),a=new Uint8Array(w*h);for(let i=0;i<a.length;i++){const R=raw[i*4],G=raw[i*4+1],B=raw[i*4+2];let best=0,d0=1e12;for(let j=0;j<cs.length;j++){const c=cs[j],d=(R-c[0])**2+(G-c[1])**2+(B-c[2])**2;if(d<d0){d0=d;best=j}}a[i]=best}for(let p=0;p<+$('smooth').value;p++){const b=Uint8Array.from(a);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,c={};for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){const v=b[i+yy*w+xx];c[v]=(c[v]||0)+1}a[i]=+Object.entries(c).sort((q,r)=>r[1]-q[1])[0][0]}}return a}
function components(a){const seen=new Uint8Array(a.length),out=[];for(let i=0;i<a.length;i++){if(seen[i])continue;const label=a[i],pix=[],st=[i];seen[i]=1;while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;pix.push(p);const ns=[];if(x)ns.push(p-1);if(x<w-1)ns.push(p+1);if(y)ns.push(p-w);if(y<h-1)ns.push(p+w);for(const q of ns)if(!seen[q]&&a[q]===label){seen[q]=1;st.push(q)}}out.push({label,pixels:pix})}return out}
function merge(a){const min=+$('minArea').value;for(let k=0;k<3;k++){const rs=components(a),small=rs.filter(r=>r.pixels.length<min);if(!small.length)break;for(const r of small){const votes={};for(const p of r.pixels){const x=p%w,y=(p/w)|0,ns=[];if(x)ns.push(p-1);if(x<w-1)ns.push(p+1);if(y)ns.push(p-w);if(y<h-1)ns.push(p+w);for(const q of ns)if(a[q]!==r.label)votes[a[q]]=(votes[a[q]]||0)+1}const b=Object.entries(votes).sort((q,z)=>z[1]-q[1])[0];if(b)r.pixels.forEach(p=>a[p]=+b[0])}}return a}
function analyseAll(){proposals.forEach(p=>{p.labels=merge(assign(p.woods));p.regions=components(p.labels);p.counts=new Array(p.woods.length).fill(0);p.regions.forEach(r=>p.counts[r.label]++);p.total=p.counts.reduce((a,b)=>a+b,0)});renderProposalCards();use(active)}
function renderProposalCards(){const sel=$('paletteSelect');sel.innerHTML=proposals.map((p,i)=>`<option value="${i}">${p.name} • ${p.total} pièces</option>`).join('');sel.value=active;sel.onchange=()=>use(+sel.value)}
function use(i){active=i;const p=proposals[i];labels=p.labels;regions=p.regions;$('selectedName').textContent=p.name;$('paletteSelect').value=i;$('paletteDescription').textContent=p.desc;$('paletteSummary').innerHTML=p.woods.map((x,j)=>{const c=rgb(x.color),ink=(c[0]+c[1]+c[2])<360?'#fff':'#111';return `<div class="color-icon" style="background:${x.color};color:${ink}" title="${x.name} : ${p.counts[j]} pièce${p.counts[j]>1?'s':''}"><span>${p.counts[j]}</span><small>${x.name}</small></div>`}).join('');draw(p);updateSheet(p)}
function draw(p){const c=$('canvas'),s=Math.max(1,Math.min(3,Math.floor(1000/Math.max(w,h))));c.width=w*s;c.height=h*s;const x=c.getContext('2d');x.imageSmoothingEnabled=false;for(let y=0;y<h;y++){let st=0,cur=p.labels[y*w];for(let xx=1;xx<=w;xx++){const nx=xx<w?p.labels[y*w+xx]:255;if(nx!==cur){x.fillStyle=p.woods[cur].color;x.fillRect(st*s,y*s,(xx-st)*s,s);st=xx;cur=nx}}}$('preview').style.aspectRatio=w+'/'+h;$('info').textContent=w+' × '+h+' px • '+p.total+' pièces'}
function updateSheet(p){const l=['FICHE MARQUETERIE','------------------','Palette : '+p.name,'Dimensions : '+$('widthMm').value+' × '+$('heightMm').value+' mm','Résolution : '+w+' × '+h+' px','Essences : '+p.woods.length,'','PIÈCES PAR ESSENCE'];p.woods.forEach((x,i)=>l.push((i+1)+'. '+x.name+' : '+p.counts[i]+' pièce'+(p.counts[i]>1?'s':'')));l.push('','TOTAL : '+p.total+' pièces');$('sheet').textContent=l.join('\n')}
function process(){const im=new Image();im.onload=()=>{ratio=im.width/im.height;$('sourcePx').textContent=im.width+' × '+im.height+' px';const r=+$('res').value;if(im.width>=im.height){w=r;h=Math.max(1,Math.round(r*im.height/im.width))}else{h=r;w=Math.max(1,Math.round(r*im.width/im.height))}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.filter='blur(.5px)';x.drawImage(im,0,0,w,h);raw=x.getImageData(0,0,w,h).data;proposals=makeProposals(+$('count').value);analyseAll()};im.src=source}
function paletteCanvas(p){const c=document.createElement('canvas');c.width=760;c.height=60+p.woods.length*40;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font='bold 22px sans-serif';x.fillText(p.name+' • '+p.total+' pièces',20,32);x.font='15px sans-serif';p.woods.forEach((q,i)=>{x.fillStyle=q.color;x.fillRect(20,50+i*40,60,28);x.fillStyle='#111';x.fillText((i+1)+'. '+q.name+' • '+p.counts[i]+' pièce'+(p.counts[i]>1?'s':''),95,70+i*40)});return c}
function svgExport(p){let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">`;for(let y=0;y<h;y++){let st=0,cur=p.labels[y*w];for(let x=1;x<=w;x++){const nx=x<w?p.labels[y*w+x]:255;if(nx!==cur){s+=`<rect x="${st}" y="${y}" width="${x-st}" height="1" fill="${p.woods[cur].color}" data-essence="${p.woods[cur].name}"/>`;st=x;cur=nx}}}s+='</svg>';dl(new Blob([s],{type:'image/svg+xml'}),'marqueterie_'+p.name[0]+'.svg')}
