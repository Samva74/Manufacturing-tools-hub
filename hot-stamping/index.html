</style></head><body><div class="wrap"><div class="card brand-card"><img src="logo-hot-stamping.png" class="brand-logo" alt="Hot Stamping"></div><div class="card selector-card"><div class="version-row"><a id="lnk-fr" href="#" onclick="setLang('fr');return false;">Version FR</a><a id="lnk-en" href="#" onclick="setLang('en');return false;">Version English</a><a id="lnk-pt" href="#" onclick="setLang('pt');return false;">Version Português</a></div></div><div class="card"><h2><span class="dot"></span><span data-t="machineTitle"></span></h2><div class="label-row"><label data-t="machine"></label><button class="mini-plus" onclick="addHotMachine()">+</button></div><select id="machine"></select><div class="row"><div><label data-t="tmax"></label><div class="field"><input id="machineTempMax" type="number" value="160"><span class="unit">°C</span></div></div><div><label data-t="pmax"></label><div class="field"><input id="machinePressureMax" type="number" value="8"><span class="unit">bar</span></div></div></div><label data-t="site"></label><input id="site" type="text" value="Atelier"></div><div class="card"><h2><span class="dot"></span><span data-t="inputsTitle"></span></h2><div class="label-row"><label data-t="support"></label><button class="mini-plus" onclick="addHotSupport()">+</button></div><select id="support"></select><div class="label-row"><label data-t="foil"></label><button class="mini-plus" onclick="addHotFoil()">+</button></div><select id="foil"></select><div class="row"><div><label data-t="area"></label><div class="field"><input id="area" type="number" step="0.1" value="10"><span class="unit">cm²</span></div></div><div><label data-t="operator"></label><input id="operator" type="text" value="Atelier"></div></div></div><div id="results"><div class="card"><h2><span class="dot"></span>📋 <span data-t="quick"></span></h2><div class="res-main"><div class="res-big" id="boxTemp"><div class="lbl" data-t="temp"></div><div class="val" id="rTemp">–</div><div class="u">°C</div></div><div class="res-big" id="boxPress"><div class="lbl" data-t="pressure"></div><div class="val" id="rPressure">–</div><div class="u">bar</div></div><div class="res-big" id="boxDwell"><div class="lbl" data-t="dwell"></div><div class="val" id="rDwell">–</div><div class="u">s</div></div></div><div class="res-line"><span class="k" data-t="supplier"></span><span class="v" id="rSupplier">–</span></div><div class="res-line"><span class="k" data-t="color"></span><span class="v" id="rColor">–</span></div><div class="res-line"><span class="k" data-t="alert"></span><span class="v" id="rAlert">–</span></div><div class="vigil" id="rVigil">–</div></div></div><div id="calib"><div class="card"><h2><span class="dot"></span>🎯 <span data-t="calib"></span></h2><p style="font-size:13px;color:var(--muted);margin:0 0 6px" data-t="calibp"></p><div class="row"><div><label data-t="ctemp"></label><div class="field"><input id="cTemp" type="number"><span class="unit">°C</span></div></div><div><label data-t="cpress"></label><div class="field"><input id="cPress" type="number" step="0.1"><span class="unit">bar</span></div></div></div><label data-t="cdwell"></label><div class="field"><input id="cDwell" type="number" step="0.01"><span class="unit">s</span></div><label data-t="note"></label><textarea id="cNote"></textarea><button class="btn btn-save" onclick="saveCalib()" data-t="save"></button><div class="btn-row"><button class="btn btn-ghost" onclick="fillFromResult()" data-t="fill"></button><button class="btn btn-ghost" onclick="loadHotCalibrations()">↻ Recharger</button></div></div><div class="card"><h2><span class="dot"></span>☁️ <span data-t="cloud"></span></h2><div id="hotCalibList"><div class="empty">Aucune donnée chargée.</div></div></div><p class="foot" data-t="foot"></p></div><div id="toast" class="toast"></div></div><script>

let lang=localStorage.getItem('hot_lang')||'fr';const $=id=>document.getElementById(id);function t(k){return TXT[lang][k]||TXT.fr[k]||k;}function num(id){return parseFloat(($(id).value||'').toString().replace(',','.'));}function r1(x){return (Math.round(Number(x||0)*10)/10).toString().replace('.',lang==='en'?'.':',');}function r2(x){return (Math.round(Number(x||0)*100)/100).toString().replace('.',lang==='en'?'.':',');}function toast(msg){let to=$('toast');to.textContent=msg;to.className='toast show';setTimeout(()=>to.className='toast',1800);}function sbHeaders(extra={}){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra};}
const TXT={fr:{machineTitle:'Entrées machine',machine:'Machine',tmax:'Température max machine',pmax:'Pression max machine',site:'Site',inputsTitle:'Support & folio',support:'Support',foil:'Folio',area:'Surface marquée',operator:'Opérateur',quick:'Lecture rapide',temp:'Température',pressure:'Pression',dwell:'Temps de pose',supplier:'Fournisseur',color:'Couleur',alert:'Alerte machine',calib:'Calibration atelier',calibp:'Les champs sont préremplis depuis le folio sélectionné. Modifiez-les puis enregistrez le réglage validé.',ctemp:'Température validée',cpress:'Pression validée',cdwell:'Temps validé',note:'Remarque',save:'💾 Enregistrer comme réglage validé',fill:'⤵ Reprendre valeurs calculées',cloud:'Bibliothèque Supabase Hot Stamping',foot:'Hot Stamping Calculator V2 Supabase FR / EN / PT.'},en:{machineTitle:'Machine inputs',machine:'Machine',tmax:'Machine max temperature',pmax:'Machine max pressure',site:'Site',inputsTitle:'Support & foil',support:'Support',foil:'Foil',area:'Stamped area',operator:'Operator',quick:'Quick read',temp:'Temperature',pressure:'Pressure',dwell:'Dwell time',supplier:'Supplier',color:'Color',alert:'Machine alert',calib:'Shop calibration',calibp:'Fields are pre-filled from the selected foil. Adjust them before saving the validated setting.',ctemp:'Validated temperature',cpress:'Validated pressure',cdwell:'Validated dwell time',note:'Note',save:'💾 Save as validated setting',fill:'⤵ Reuse calculated values',cloud:'Supabase Hot Stamping library',foot:'Hot Stamping Calculator V2 Supabase FR / EN / PT.'},pt:{machineTitle:'Entradas da máquina',machine:'Máquina',tmax:'Temperatura máxima da máquina',pmax:'Pressão máxima da máquina',site:'Site',inputsTitle:'Suporte & folha',support:'Suporte',foil:'Folha',area:'Área marcada',operator:'Operador',quick:'Leitura rápida',temp:'Temperatura',pressure:'Pressão',dwell:'Tempo de contacto',supplier:'Fornecedor',color:'Cor',alert:'Alerta máquina',calib:'Calibração de oficina',calibp:'Os campos são preenchidos a partir da folha selecionada. Ajuste antes de guardar.',ctemp:'Temperatura validada',cpress:'Pressão validada',cdwell:'Tempo validado',note:'Nota',save:'💾 Guardar como ajuste validado',fill:'⤵ Reutilizar valores calculados',cloud:'Biblioteca Supabase Hot Stamping',foot:'Hot Stamping Calculator V2 Supabase FR / EN / PT.'}};
const DEFAULT_MACHINES=[{name:'Générique',temperature_max:160,pressure_max:8,dwell_time_max:2,site:'Atelier'},{name:'Presse manuelle',temperature_max:150,pressure_max:6,dwell_time_max:2,site:'Atelier'}];
const DEFAULT_SUPPORTS=[{code:'paper',name_fr:'Papier couché / carton couché',name_en:'Coated paper / coated board',name_pt:'Papel revestido / cartão revestido',family:'Papier'},{code:'pu',name_fr:'PU / similicuir',name_en:'PU / synthetic leather',name_pt:'PU / couro sintético',family:'Textile'},{code:'texterra',name_fr:'Texterra',name_en:'Texterra',name_pt:'Texterra',family:'Microfibre'},{code:'majilite',name_fr:'Majilite',name_en:'Majilite',name_pt:'Majilite',family:'Microfibre'}];
const DEFAULT_FOILS=[{support_code:'paper',foil_code:'kurz_luxor_hc',supplier:'KURZ',color:'Gold / Silver',label_fr:'KURZ - LUXOR / ALUFIN HC',label_en:'KURZ - LUXOR / ALUFIN HC',label_pt:'KURZ - LUXOR / ALUFIN HC',temperature_min:95,temperature_rec:105,temperature_max:120,pressure_min:1.5,pressure_rec:2,pressure_max:3,dwell_time_min:.4,dwell_time_rec:.8,dwell_time_max:1.2},{support_code:'pu',foil_code:'standard_pu',supplier:'Standard',color:'Metallic',label_fr:'Folio standard PU',label_en:'Standard PU foil',label_pt:'Folha standard PU',temperature_min:105,temperature_rec:120,temperature_max:135,pressure_min:2,pressure_rec:3,pressure_max:4.5,dwell_time_min:.5,dwell_time_rec:.9,dwell_time_max:1.4},{support_code:'texterra',foil_code:'texterra_test',supplier:'Atelier',color:'Test',label_fr:'Folio test Texterra',label_en:'Texterra test foil',label_pt:'Folha teste Texterra',temperature_min:105,temperature_rec:118,temperature_max:130,pressure_min:2,pressure_rec:3.2,pressure_max:5,dwell_time_min:.5,dwell_time_rec:.8,dwell_time_max:1.2}];

function setLang(l){lang=l;localStorage.setItem('hot_lang',l);refreshText();}function refreshText(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));['fr','en','pt'].forEach(l=>{let a=$('lnk-'+l);if(a)a.className=l===lang?'active':''});fillMachines();fillSupports();fillFoils();calc();}
function labelSupport(s){return s['name_'+lang]||s.name_fr||s.code;}function labelFoil(f){return f['label_'+lang]||f.label_fr||f.foil_code;}function fillMachines(cur=$('machine')?.value){$('machine').innerHTML='';machines.forEach(m=>$('machine').add(new Option(m.name,m.name)));if(cur&&machines.some(m=>m.name===cur))$('machine').value=cur;}function fillSupports(cur=$('support')?.value){$('support').innerHTML='';supports.forEach(s=>$('support').add(new Option(labelSupport(s),s.code)));if(cur&&supports.some(s=>s.code===cur))$('support').value=cur;}function fillFoils(cur=$('foil')?.value){let sc=$('support').value;$('foil').innerHTML='';foils.filter(f=>!f.support_code||f.support_code===sc).forEach(f=>$('foil').add(new Option(labelFoil(f),f.foil_code)));if(cur&&foils.some(f=>f.foil_code===cur))$('foil').value=cur;calc();}
function currentFoil(){return foils.find(f=>f.foil_code===$('foil').value)||foils[0];}function currentMachine(){return machines.find(m=>m.name===$('machine').value)||machines[0];}function currentSupport(){return supports.find(s=>s.code===$('support').value)||supports[0];}
function calc(){const f=currentFoil(),m=currentMachine(); if(!f||!m)return;let temp=f.temperature_rec||105,press=f.pressure_rec||2,dwell=f.dwell_time_rec||.8;$('rTemp').textContent=r1(temp);$('rPressure').textContent=r1(press);$('rDwell').textContent=r2(dwell);$('rSupplier').textContent=f.supplier||'–';$('rColor').textContent=f.color||'–';let warns=[];if(m.temperature_max&&temp>m.temperature_max)warns.push('Température > machine');if(m.pressure_max&&press>m.pressure_max)warns.push('Pression > machine');$('rAlert').innerHTML=warns.length?'<span class="badge warn">'+warns.join(' · ')+'</span>':'<span class="badge ok">OK</span>';$('rVigil').textContent='⚠️ Valider par essai atelier avant production.';$('cTemp').value=r1(temp).replace(',','.');$('cPress').value=r1(press).replace(',','.');$('cDwell').value=r2(dwell).replace(',','.');}
async function apiGet(table,query='?select=*'){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{headers:sbHeaders()});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}async function apiInsert(table,payload){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:sbHeaders({Prefer:'return=representation'}),body:JSON.stringify(payload)});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
function slug(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||('item_'+Date.now())}function nval(v,d){const n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:d;}
async function loadEditableLibrary(){try{const m=await apiGet('hot_machines','?select=*&order=name.asc');if(m.length)machines=[...DEFAULT_MACHINES,...m.filter(x=>!DEFAULT_MACHINES.some(d=>d.name===x.name))]}catch(e){console.warn('hot_machines',e)}try{const s=await apiGet('hot_supports','?select=*&order=name_fr.asc');if(s.length)supports=[...DEFAULT_SUPPORTS,...s.filter(x=>!DEFAULT_SUPPORTS.some(d=>d.code===x.code))]}catch(e){console.warn('hot_supports',e)}try{const f=await apiGet('hot_foils','?select=*&order=label_fr.asc');if(f.length)foils=[...DEFAULT_FOILS,...f.filter(x=>!DEFAULT_FOILS.some(d=>d.foil_code===x.foil_code))]}catch(e){console.warn('hot_foils',e)}fillMachines();fillSupports();fillFoils();}
async function addHotMachine(){
const name=prompt('Nom de la machine',$('machine').value||'Nouvelle machine');
if(!name)return;

const temperature_max=nval(prompt('Température max °C','160'),160);
const pressure_max=nval(prompt('Pression max bar','8'),8);
const dwell_time_max=nval(prompt('Temps max s','2'),2);

const site=prompt('Site',$('site').value||'Atelier')||'Atelier';
try{
const [row]=await apiInsert('hot_machines',{
name:name.trim(),
temperature_max,
pressure_max,
dwell_time_max,
site
});

machines.push(row);
fillMachines(row.name);

applyMachineData();

toast('Machine ajoutée + Supabase');
}
catch(e){
console.error(e);
toast('Erreur ajout machine');
}
}
async function addHotSupport(){const name_fr=prompt('Nom support FR','Nouveau support');if(!name_fr)return;const code=slug(prompt('Code support simple',slug(name_fr))||name_fr);const name_en=prompt('Nom support EN',name_fr)||name_fr;const name_pt=prompt('Nom support PT',name_fr)||name_fr;const family=prompt('Famille','Support ajouté')||'Support ajouté';try{const [row]=await apiInsert('hot_supports',{code,name_fr:name_fr.trim(),name_en:name_en.trim(),name_pt:name_pt.trim(),family:family.trim()});supports.push(row);fillSupports(row.code);fillFoils();toast('Support ajouté + Supabase')}catch(e){console.error(e);toast('Erreur ajout support')}}
async function addHotFoil(){const support_code=$('support').value;const label_fr=prompt('Nom folio FR','Nouveau folio');if(!label_fr)return;const foil_code=slug(prompt('Code folio simple',slug(label_fr))||label_fr);const label_en=prompt('Nom folio EN',label_fr)||label_fr;const label_pt=prompt('Nom folio PT',label_fr)||label_fr;const supplier=prompt('Fournisseur','KURZ')||'';const color=prompt('Couleur','')||'';const temperature_rec=nval(prompt('Température recommandée °C','110'),110);const pressure_rec=nval(prompt('Pression recommandée bar','2'),2);const dwell_time_rec=nval(prompt('Temps recommandé s','0.8'),.8);try{const [row]=await apiInsert('hot_foils',{support_code,foil_code,label_fr:label_fr.trim(),label_en:label_en.trim(),label_pt:label_pt.trim(),supplier:supplier.trim(),color:color.trim(),temperature_min:temperature_rec-10,temperature_rec,temperature_max:temperature_rec+10,pressure_min:Math.max(0,pressure_rec-.5),pressure_rec,pressure_max:pressure_rec+.5,dwell_time_min:Math.max(0,dwell_time_rec-.2),dwell_time_rec,dwell_time_max:dwell_time_rec+.2});foils.push(row);fillFoils(row.foil_code);toast('Folio ajouté + Supabase')}catch(e){console.error(e);toast('Erreur ajout folio')}}
async function saveCalib(){const f=currentFoil(),s=currentSupport();const payload={material:labelSupport(s),foil:labelFoil(f),temperature:num('cTemp'),pressure:num('cPress'),dwell_time:num('cDwell'),operator:$('operator').value||'Atelier',site:$('site').value||'Atelier',comments:$('cNote').value||''};if(!payload.temperature||!payload.pressure||!payload.dwell_time){toast('Valeurs ?');return}try{await apiInsert(CALIB_TABLE,payload);toast('Enregistré local + Supabase');loadHotCalibrations()}catch(e){console.error(e);toast('Erreur Supabase')}}function fillFromResult(){calc();}
async function loadHotCalibrations(){const host=$('hotCalibList');host.innerHTML='<div class="empty">Chargement Supabase...</div>';try{remoteCalibs=await apiGet(CALIB_TABLE,'?select=*&order=created_at.desc&limit=50');renderHotCalibrations()}catch(e){host.innerHTML=`<div class="empty">Supabase non disponible : ${String(e.message).replace(/[<>]/g,'')}</div>`}}
function renderHotCalibrations(){const host=$('hotCalibList');if(!remoteCalibs.length){host.innerHTML='<div class="empty">Aucune calibration Supabase enregistrée pour le moment.</div>';return}host.innerHTML=remoteCalibs.map(r=>{const d=r.created_at?new Date(r.created_at).toLocaleDateString('fr-FR'):'';return `<div class="calib-item"><div class="t">${esc(r.material)} · ${esc(r.foil)}</div><div class="s">${r.temperature??''} °C · ${r.pressure??''} bar · ${r.dwell_time??''} s<br>${esc(r.site)} · ${esc(r.operator)} · ${d}${r.comments?'<br><i>'+esc(r.comments)+'</i>':''}</div></div>`}).join('')}function esc(v){return String(v??'').replace(/[<>]/g,'')}
function applyMachineData(){

const m = machines.find(
x => x.name === $('machine').value
);

if(!m) return;

if(m.temperature_max != null)
$('machineTempMax').value = m.temperature_max;

if(m.pressure_max != null)
$('machinePressureMax').value = m.pressure_max;

if(m.site)
$('site').value = m.site;

calc();
