<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hot Stamping Calculator</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../auth-guard.js"></script><style>:root{--bg:#d8d8d3;--card:#eeeeea;--card2:#f6f6f2;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--accent:#1d1d1b;--ok:#237a3b;--soft:#e5e5df;--valid:#d9eadb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px}.wrap{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.logo{width:76px;height:76px;border:2px solid var(--txt);border-radius:20px;background:#e0e1dd;display:grid;place-items:center}.logo img{width:56px;height:56px;border-radius:12px}h1{margin:0;font-size:31px}p{color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hub-btn,.langs button,.role-pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 14px;color:var(--txt);font-weight:850;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.12)}h2{display:flex;gap:8px;margin:0 0 12px;font-size:18px}.dot{width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--accent)}label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin:10px 0 5px}.inputline{display:flex;gap:8px;align-items:stretch}select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--txt);font-size:15px}.search-btn,.edit-small{height:46px;min-width:46px;border-radius:14px;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.search-btn{border:1px solid var(--line);background:white}.edit-small{border:none;background:var(--accent);color:white}.res-big{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:13px;margin:10px 0}.res-big.valid{background:var(--valid);border-color:var(--ok)}.res-big .lbl{font-size:13px;color:var(--muted)}.res-big .val{font-size:30px;font-weight:900}.res-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;gap:20px}.note{background:rgba(29,29,27,.06);border-left:4px solid var(--accent);padding:10px;border-radius:12px;margin-top:10px;white-space:pre-line}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9998;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-panel{width:min(650px,100%);max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}.modal-head{display:flex;justify-content:space-between}.close{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:900}.result{padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin-top:8px;cursor:pointer}.result:hover{background:var(--valid)}@media(max-width:860px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo"><img src="icon-192.png"></div><div><h1>Hot Stamping Calculator</h1><p>Bibliothèque FPM optimisée : supports + folios + opérations séparés</p></div></div><div class="top-actions"><button class="hub-btn" onclick="location.href='/'">🏠 Hub</button><span class="role-pill" id="rolePill">...</span></div></div><div class="layout"><div class="col"><section class="card"><h2><span class="dot"></span><span>Bibliothèque</span></h2><label>Support</label><div class="inputline"><select id="support"></select><button class="search-btn" onclick="searchSupport()">🔍</button></div><label>Folio</label><div class="inputline"><select id="foil"></select><button class="search-btn" onclick="searchFoil()">🔍</button></div><label>Opération</label><select id="operation"></select><div class="note" id="note"></div></section></div><div class="col"><section class="card"><h2><span class="dot"></span><span>Paramètres calculés</span></h2><div class="res-big valid"><div class="lbl">Température recommandée</div><div class="val"><span id="tempRec">–</span></div></div><div class="res-big"><div class="lbl">Pression recommandée</div><div class="val"><span id="pressRec">–</span></div></div><div class="res-line"><span>Temps recommandé</span><b id="dwellRec">–</b></div><div class="res-line"><span>Température min / rec / max</span><b id="tempRange">–</b></div><div class="res-line"><span>Pression min / rec / max</span><b id="pressRange">–</b></div><div class="res-line"><span>Temps min / rec / max</span><b id="dwellRange">–</b></div></section></div></div></div><div class="modal" id="searchModal"><div class="modal-panel"><div class="modal-head"><h3 id="searchTitle">Recherche</h3><button class="close" id="searchClose">×</button></div><label>Recherche</label><input id="searchInput" placeholder="Nom, fournisseur, référence"><div id="searchResults"></div></div></div><script>const SUPABASE_URL='https://erzuvpswagzwlrxgctaj.supabase.co',SUPABASE_KEY='sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let supports=[],foils=[],ops=[],user=null,role='user';const $=id=>document.getElementById(id);async function token(){return (await sb.auth.getSession()).data.session?.access_token||SUPABASE_KEY}async function api(table,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(opt.q||''),{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await token()}});if(!r.ok)throw new Error(await r.text());return r.json()}function supLabel(s){return s.name_fr||s.code}function foilLabel(f){return f.label_fr||f.foil_code}async function initAuth(){if(window.authReady){await window.authReady;user=await window.appAuth.getUser();role=await window.appAuth.getRole();$('rolePill').textContent=(user?.email||'')+' · '+role}}async function load(){supports=await api('hot_supports',{q:'?select=*&order=name_fr.asc&limit=5000'});foils=await api('hot_foils',{q:'?select=*&order=label_fr.asc&limit=5000'});ops=await api('hot_operations',{q:'?select=*&order=operation_code.asc'});if(!ops.length)ops=[{operation_code:'standard',label_fr:'Standard',temp_factor:1,pressure_factor:1,dwell_factor:1}];fill();}function fill(){$('support').innerHTML='';supports.forEach(s=>$('support').add(new Option(supLabel(s),s.code)));$('foil').innerHTML='';foils.forEach(f=>$('foil').add(new Option(foilLabel(f),f.foil_code)));$('operation').innerHTML='';ops.forEach(o=>$('operation').add(new Option(o.label_fr||o.operation_code,o.operation_code)));calc();}function calc(){let s=supports.find(x=>x.code===$('support').value),f=foils.find(x=>x.foil_code===$('foil').value),o=ops.find(x=>x.operation_code===$('operation').value)||{temp_factor:1,pressure_factor:1,dwell_factor:1};if(!s||!f)return;let dt=Number(f.temperature_delta||0),pf=Number(f.pressure_factor||1),df=Number(f.dwell_factor||1);let tf=Number(o.temp_factor||1),opf=Number(o.pressure_factor||1),odf=Number(o.dwell_factor||1);let t=[s.temperature_min,s.temperature_rec,s.temperature_max].map(x=>Math.round((Number(x||0)+dt)*tf));let p=[s.pressure_min,s.pressure_rec,s.pressure_max].map(x=>(Number(x||0)*pf*opf).toFixed(1));let d=[s.dwell_time_min,s.dwell_time_rec,s.dwell_time_max].map(x=>(Number(x||0)*df*odf).toFixed(2));$('tempRec').textContent=t[1]+' °C';$('pressRec').textContent=p[1]+' bar';$('dwellRec').textContent=d[1]+' s';$('tempRange').textContent=t.join(' / ')+' °C';$('pressRange').textContent=p.join(' / ')+' bar';$('dwellRange').textContent=d.join(' / ')+' s';$('note').textContent=[s.family,s.note,f.foil_type,'ΔT '+dt+' °C · P× '+pf+' · t× '+df].filter(Boolean).join('
');}function modal(title,items,pick){let m=$('searchModal'),q=$('searchInput'),list=$('searchResults');$('searchTitle').textContent=title;q.value='';function render(){let term=q.value.toLowerCase().trim();let rows=items.filter(x=>!term||x.search.toLowerCase().includes(term)).slice(0,100);list.innerHTML=rows.map(x=>`<div class="result"><b>${x.title}</b><div>${x.sub||''}</div></div>`).join('')||'<p>Aucun résultat.</p>';[...list.children].forEach((el,i)=>el.onclick=()=>{pick(rows[i].value);m.classList.remove('open');calc();})}q.oninput=render;$('searchClose').onclick=()=>m.classList.remove('open');m.classList.add('open');setTimeout(()=>q.focus(),50);render();}function searchSupport(){modal('Recherche support',supports.map(s=>({title:supLabel(s),sub:[s.supplier,s.family].filter(Boolean).join(' · '),search:[s.code,supLabel(s),s.supplier,s.family,s.note].join(' '),value:s.code})),v=>$('support').value=v)}function searchFoil(){modal('Recherche folio',foils.map(f=>({title:foilLabel(f),sub:[f.supplier,f.reference,f.color,f.foil_type].filter(Boolean).join(' · '),search:[f.foil_code,foilLabel(f),f.supplier,f.reference,f.color,f.foil_type].join(' '),value:f.foil_code})),v=>$('foil').value=v)}async function init(){await initAuth();await load();['support','foil','operation'].forEach(id=>$(id).addEventListener('change',calc));}init();</script></body></html>
