<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hot Stamping Calculator</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../auth-guard.js"></script><style>
:root{--bg:#d8d8d3;--card:#eeeeea;--card2:#f6f6f2;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--accent:#1d1d1b;--ok:#237a3b;--soft:#e5e5df;--valid:#d9eadb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px}.wrap{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.logo{width:76px;height:76px;border:2px solid var(--txt);border-radius:20px;background:#e0e1dd;display:grid;place-items:center}.logo svg{width:54px;height:54px}.title h1{margin:0;font-size:31px}.title p{margin:4px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hub-btn,.langs button,.role-pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 14px;color:var(--txt);font-weight:850;text-decoration:none}.langs button.active{background:var(--accent);color:white}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.12)}.card h2{margin:0 0 12px;font-size:18px;display:flex;gap:8px}.dot{width:10px;height:10px;border-radius:10px;background:var(--accent);margin-top:6px}label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin:10px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputline{display:flex;gap:8px;align-items:stretch}select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--txt);font-size:15px}textarea{min-height:78px}.search-btn,.mini-plus{height:46px;min-width:46px;border-radius:14px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.search-btn{border:1px solid var(--line);background:white}.mini-plus{border:none;background:var(--accent);color:white;display:none}.can-edit .mini-plus{display:flex}.res-big{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:13px;margin:10px 0}.res-big.valid{background:var(--valid);border-color:var(--ok)}.res-big .lbl{font-size:13px;color:var(--muted)}.res-big .val{font-size:30px;font-weight:900}.res-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.note{background:rgba(29,29,27,.06);border-left:4px solid var(--accent);padding:10px;border-radius:12px;margin-top:10px}.btn{width:100%;border:none;border-radius:13px;background:var(--accent);color:#fff;padding:13px;margin-top:10px;font-weight:850}.btn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.lib{margin-top:14px}.item{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.item .s{color:var(--muted);font-size:13px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1b;color:white;padding:11px 14px;border-radius:999px;display:none;z-index:99}.foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9998;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}.modal-head{display:flex;justify-content:space-between}.close{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:900}.result{padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin-top:8px;cursor:pointer}.result:hover{background:var(--valid)}@media(max-width:860px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.title h1{font-size:24px}.logo{width:64px;height:64px}.logo svg{width:46px;height:46px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M30 26 H70"/><path d="M50 26 V62"/><path d="M32 62 H68 V78 H32 Z"/><path d="M38 70 H62"/></svg></div><div class="title"><h1 data-t="title">Hot Stamping Calculator</h1><p data-t="subtitle">Bibliothèque Supabase supports + folios + paramètres</p></div></div><div class="top-actions"><button class="hub-btn" onclick="goHub()">🏠 Hub</button><span class="role-pill" id="rolePill">...</span><div class="langs"><button data-lang="fr" onclick="setLang('fr')">French</button><button data-lang="en" onclick="setLang('en')">English</button><button data-lang="pt" onclick="setLang('pt')">Português</button></div></div></div><div class="layout"><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="machineInputs"></span></h2><label data-t="machine"></label><div class="inputline"><select id="machine"></select><button class="search-btn" onclick="searchMachine()">🔍</button><button class="mini-plus" onclick="addMachine()">+</button></div></section><section class="card"><h2><span class="dot"></span><span data-t="supportFoil"></span></h2><label data-t="support"></label><div class="inputline"><select id="support"></select><button class="search-btn" onclick="searchSupport()">🔍</button><button class="mini-plus" onclick="addSupport()">+</button></div><label data-t="foil"></label><div class="inputline"><select id="foil"></select><button class="search-btn" onclick="searchFoil()">🔍</button><button class="mini-plus" onclick="editFoil()">✎</button></div><div class="note" id="note"></div></section></div><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="quickRead"></span></h2><div class="res-big valid"><div class="lbl" data-t="temperature"></div><div class="val"><span id="rTemp">–</span></div></div><div class="res-big"><div class="lbl" data-t="pressure"></div><div class="val"><span id="rPress">–</span></div></div><div class="res-line"><span data-t="dwell"></span><b id="rDwell">–</b></div></section><section class="card"><h2><span class="dot"></span><span data-t="calibration"></span></h2><input id="cTemp"><input id="cPress"><input id="cDwell"><textarea id="comments"></textarea><button class="btn" onclick="saveCalib()" data-t="save"></button></section></div></div><section class="card lib"><h2><span class="dot"></span><span data-t="library"></span></h2><button class="btn secondary" onclick="loadCalibs()" data-t="reload"></button><div id="calibs"></div></section><div class="foot" data-t="foot"></div></div><div class="toast" id="toast"></div><div class="modal" id="searchModal"><div class="modal-panel"><div class="modal-head"><h3 id="searchTitle">Recherche</h3><button class="close" id="searchClose">×</button></div><label>Recherche</label><input id="searchInput" placeholder="Nom, numéro ou référence"><div id="searchResults"></div></div></div><script>const APP='hot';
const SUPABASE_URL='https://erzuvpswagzwlrxgctaj.supabase.co', SUPABASE_KEY='sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let lang=localStorage.getItem(APP+'_lang')||'fr',user=null,role='user';const canEdit=()=>['expert','admin'].includes(role);async function token(){return (await sb.auth.getSession()).data.session?.access_token||SUPABASE_KEY}async function api(table,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(opt.q||''),{method:opt.m||'GET',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:opt.b?JSON.stringify(opt.b):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function goHub(){location.href='/'}function setLang(l){lang=l;localStorage.setItem(APP+'_lang',l);refreshText()}function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillLists();calc()}async function audit(table,record,action,field,oldv,newv){try{await api('library_history',{m:'POST',b:{application:APP,table_name:table,record_id:String(record||''),action,field_name:field||'',old_value:String(oldv||''),new_value:String(newv||''),user_id:user?.id,user_email:user?.email}})}catch(e){console.warn(e)}}async function initAuth(){await window.authReady;user=await window.appAuth.getUser();role=await window.appAuth.getRole();let rp=$('rolePill');if(rp)rp.textContent=(user?.email||'')+' · '+role;if(canEdit())document.body.classList.add('can-edit')}function openSearch(title,items,onPick){let m=$('searchModal'),q=$('searchInput'),list=$('searchResults');$('searchTitle').textContent=title;q.value='';function render(){let term=q.value.toLowerCase().trim();let rows=items.filter(x=>!term||x.search.toLowerCase().includes(term)).slice(0,60);list.innerHTML=rows.map((x,i)=>`<div class="result"><b>${x.title}</b><div class="s">${x.sub||''}</div></div>`).join('')||'<p>Aucun résultat.</p>';[...list.children].forEach((el,i)=>el.onclick=()=>{onPick(rows[i].value);closeSearch()})}q.oninput=render;$('searchClose').onclick=closeSearch;m.classList.add('open');setTimeout(()=>q.focus(),50);render()}function closeSearch(){$('searchModal').classList.remove('open')}
const TXT={fr:{title:'Hot Stamping Calculator',subtitle:'Bibliothèque Supabase supports + folios + paramètres',machineInputs:'Entrées machine',supportFoil:'Support & Folio',machine:'Machine',support:'Support',foil:'Folio',quickRead:'Lecture rapide',temperature:'Température recommandée',pressure:'Pression recommandée',dwell:'Temps de contact',calibration:'Calibration atelier',save:'💾 Enregistrer calibration',library:'Bibliothèque Supabase Hot Stamping',reload:'↻ Recharger Supabase',foot:'Les données viennent de Supabase.'},en:{title:'Hot Stamping Calculator',subtitle:'Supabase substrate + foil library',machineInputs:'Machine inputs',supportFoil:'Substrate & Foil',machine:'Machine',support:'Substrate',foil:'Foil',quickRead:'Quick read',temperature:'Recommended temperature',pressure:'Recommended pressure',dwell:'Dwell time',calibration:'Workshop calibration',save:'💾 Save calibration',library:'Hot Stamping Supabase library',reload:'↻ Reload Supabase',foot:'Data comes from Supabase.'},pt:{title:'Hot Stamping Calculator',subtitle:'Biblioteca Supabase suportes + películas',machineInputs:'Entradas da máquina',supportFoil:'Suporte & Película',machine:'Máquina',support:'Suporte',foil:'Película',quickRead:'Leitura rápida',temperature:'Temperatura recomendada',pressure:'Pressão recomendada',dwell:'Tempo de contacto',calibration:'Calibração oficina',save:'💾 Guardar calibração',library:'Biblioteca Hot Stamping',reload:'↻ Recarregar',foot:'Dados vêm do Supabase.'}};let supports=[],foils=[],machines=[];async function loadLibraries(){supports=await api('hot_supports',{q:'?select=*&order=name_fr.asc'});foils=await api('hot_foils',{q:'?select=*&order=label_fr.asc'});machines=await api('hot_machines',{q:'?select=*&order=name.asc'});if(!machines.length)machines=[{name:'Presse standard'}]}function loc(r,b){return r[b+'_'+lang]||r[b+'_fr']||r[b]||''}function sl(x){return loc(x,'name')||x.code||x.id||''}function fl(x){return loc(x,'label')||x.foil_code||x.id||''}function fillLists(){let m=$('machine'),vm=m.value;m.innerHTML='';machines.forEach(x=>m.add(new Option(x.name,x.name)));if(vm)m.value=vm;let s=$('support'),vs=s.value;s.innerHTML='';supports.forEach(x=>s.add(new Option(sl(x),x.code||x.id)));if([...s.options].some(o=>o.value===vs))s.value=vs;let f=$('foil'),vf=f.value;f.innerHTML='';foils.forEach(x=>f.add(new Option((x.supplier?x.supplier+' · ':'')+fl(x),x.foil_code||x.id)));if([...f.options].some(o=>o.value===vf))f.value=vf}function sf(){return foils.find(f=>String(f.foil_code||f.id)===$('foil').value)}function calc(){let f=sf();if(!f)return;$('rTemp').textContent=(f.temperature_rec||'–')+' °C';$('rPress').textContent=(f.pressure_rec||'–')+' bar';$('rDwell').textContent=(f.dwell_time_rec||'–')+' s';$('cTemp').value=f.temperature_rec||'';$('cPress').value=f.pressure_rec||'';$('cDwell').value=f.dwell_time_rec||'';let s=supports.find(x=>String(x.code||x.id)===$('support').value);$('note').textContent=s?(s.note||s.family||''):''}function searchMachine(){openSearch('Recherche machine',machines.map(m=>({title:m.name,sub:'Machine',search:m.name,value:m.name})),v=>{$('machine').value=v;calc()})}function searchSupport(){openSearch('Recherche support',supports.map(s=>({title:sl(s),sub:[s.supplier,s.collection,s.reference,s.family].filter(Boolean).join(' · '),search:[s.code,s.supplier,s.collection,s.reference,sl(s),s.note].join(' '),value:String(s.code||s.id)})),v=>{$('support').value=v;calc()})}function searchFoil(){openSearch('Recherche folio',foils.map(f=>({title:(f.supplier?f.supplier+' · ':'')+fl(f),sub:[f.color,'T '+(f.temperature_rec||''),'P '+(f.pressure_rec||'')].join(' · '),search:[f.foil_code,f.supplier,f.color,fl(f)].join(' '),value:String(f.foil_code||f.id)})),v=>{$('foil').value=v;calc()})}async function editFoil(){toast('Édition via rôle expert/admin')}async function addSupport(){toast('Ajout via rôle expert/admin')}async function addMachine(){toast('Ajout via rôle expert/admin')}async function saveCalib(){await api('Hot_Stamping_calibrations',{m:'POST',b:{material:$('support').value,foil:$('foil').value,machine:$('machine').value,temperature:+$('cTemp').value,pressure:+$('cPress').value,dwell_time:+$('cDwell').value,comments:$('comments').value,created_by_user_id:user.id,created_by_email:user.email}});toast('Calibration enregistrée');loadCalibs()}async function loadCalibs(){let h=$('calibs');h.innerHTML='';try{let rows=await api('Hot_Stamping_calibrations',{q:'?select=*&order=created_at.desc&limit=20'});if(!rows.length){h.innerHTML='<p>Aucune calibration.</p>';return}rows.forEach(r=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${r.material||''} · ${r.foil||''}</b><div class="s">${r.temperature||'-'} °C · ${r.pressure||'-'} bar<br>${r.created_by_email||r.operator||''}</div>`;h.appendChild(d)})}catch(e){h.innerHTML='<p>Supabase non chargé.</p>'}}async function init(){await initAuth();await loadLibraries();refreshText();loadCalibs();['machine','support','foil'].forEach(id=>$(id).addEventListener('input',calc))}init();
</script></body></html>
