const TXT={fr:{title:'Hot Stamping Calculator',subtitle:'Supports + folios + température / pression / temps',machineInputs:'Entrées machine',supportFoil:'Support & Folio',machine:'Machine',tempMax:'Température max',pressMax:'Pression max',site:'Site',support:'Support',foil:'Folio',area:'Surface',quickRead:'Lecture rapide',temperature:'Température recommandée',pressure:'Pression recommandée',dwell:'Temps de contact',calibration:'Calibration atelier',validTemp:'Température validée',validPress:'Pression validée',validDwell:'Temps validé',comments:'Remarque',save:'💾 Enregistrer comme réglage validé',useCalc:'⤵ Reprendre valeurs calculées',library:'Bibliothèque Supabase Hot Stamping',reload:'↻ Recharger Supabase',foot:'Hot Stamping Calculator · réglages indicatifs à valider sur chute matière avant production.'},en:{title:'Hot Stamping Calculator',subtitle:'Substrates + foils + temperature / pressure / dwell time',machineInputs:'Machine inputs',supportFoil:'Substrate & Foil',machine:'Machine',tempMax:'Max temperature',pressMax:'Max pressure',site:'Site',support:'Substrate',foil:'Foil',area:'Area',quickRead:'Quick read',temperature:'Recommended temperature',pressure:'Recommended pressure',dwell:'Dwell time',calibration:'Workshop calibration',validTemp:'Validated temperature',validPress:'Validated pressure',validDwell:'Validated dwell time',comments:'Notes',save:'💾 Save as validated setting',useCalc:'⤵ Use calculated values',library:'Hot Stamping Supabase library',reload:'↻ Reload Supabase',foot:'Hot Stamping Calculator · indicative settings to validate on scrap before production.'},pt:{title:'Hot Stamping Calculator',subtitle:'Suportes + películas + temperatura / pressão / tempo',machineInputs:'Entradas da máquina',supportFoil:'Suporte & Película',machine:'Máquina',tempMax:'Temperatura máx.',pressMax:'Pressão máx.',site:'Site',support:'Suporte',foil:'Película',area:'Área',quickRead:'Leitura rápida',temperature:'Temperatura recomendada',pressure:'Pressão recomendada',dwell:'Tempo de contacto',calibration:'Calibração oficina',validTemp:'Temperatura validada',validPress:'Pressão validada',validDwell:'Tempo validado',comments:'Observação',save:'💾 Guardar como ajuste validado',useCalc:'⤵ Usar valores calculados',library:'Biblioteca Supabase Hot Stamping',reload:'↻ Recarregar Supabase',foot:'Hot Stamping Calculator · parâmetros indicativos a validar em amostra antes da produção.'}};

function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)} function goHub(){location.href='/'} function setLang(l){lang=l;localStorage.setItem('hot_lang',l);refreshText()} function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillAll();calc()} function fillAll(){let sm=$('machine'),vm=sm.value;sm.innerHTML='';machines.forEach(m=>sm.add(new Option(m.name,m.name)));if(vm)sm.value=vm;let ss=$('support'),vs=ss.value;ss.innerHTML='';Object.entries(supports).forEach(([k,v])=>ss.add(new Option(v.n[lang],k)));if(supports[vs])ss.value=vs;let sf=$('foil'),vf=sf.value;sf.innerHTML='';Object.entries(foils).forEach(([k,v])=>sf.add(new Option(v.n[lang],k)));if(foils[vf])sf.value=vf}function calc(){let f=foils[$('foil').value],m=machines.find(x=>x.name===$('machine').value)||machines[0];$('rTemp').textContent=Math.min(f.temp,m.temperature_max||f.temp);$('rPress').textContent=Math.min(f.press,m.pressure_max||f.press);$('rDwell').textContent=f.dwell+' s';$('hotNote').textContent='Tester sur chute avant production.';$('cTemp').value=$('rTemp').textContent;$('cPress').value=$('rPress').textContent;$('cDwell').value=f.dwell}
