<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#d8d8d3"><title>Manufacturing Tools Hub</title><style>
:root{--bg:#d8d8d3;--card:#eeeeea;--card2:#f6f6f2;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--accent:#1d1d1b;--err:#b42318;--ok:#237a3b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4}body{min-height:100vh;padding:18px}.wrap{width:100%;max-width:860px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 22px rgba(0,0,0,.12)}.title{text-align:center}.title h1{margin:4px 0 6px;font-size:26px;letter-spacing:.8px;text-transform:uppercase}.title p{margin:0;color:var(--muted);font-size:14px}.auth-grid{display:grid;grid-template-columns:1fr;gap:10px}label{font-size:14px;color:var(--muted);font-weight:700}input{width:100%;padding:14px 15px;font-size:17px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--txt);margin:6px 0 8px}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:800;margin-top:8px;background:var(--accent);color:#fff}.btn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.app-card{text-decoration:none;color:var(--txt);display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:150px}.app-card .icon{width:54px;height:54px;border-radius:14px;background:#1d1d1b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;margin-bottom:12px}.app-card h2{margin:0 0 8px;font-size:20px}.app-card p{margin:0;color:var(--muted);font-size:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.user{font-size:13px;color:var(--muted);word-break:break-all}.msg{font-size:13px;color:var(--err);white-space:pre-wrap;margin-top:8px}.ok{color:var(--ok)}.hidden{display:none!important}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
</style></head>
<body>

<button class="hub-back-btn"
        onclick="goHub()"
        type="button">
🏠 Hub
</button>

<div class="wrap"><div class="card title"><h1>Manufacturing Tools Hub</h1><p>Connexion par adresse email et mot de passe.</p></div><div id="authCard" class="card"><div class="auth-grid"><div><label>Adresse email</label><input id="email" type="email" autocomplete="email" placeholder="nom@entreprise.com"></div><div><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"></div><button class="btn" onclick="login()">Se connecter</button><button class="btn secondary" onclick="signup()">Créer un compte à la première ouverture</button><button class="btn secondary" onclick="resetPassword()">Mot de passe oublié</button><div id="authMsg" class="msg"></div></div></div><div id="dashboard" class="hidden"><div class="card topbar"><div><strong>Applications</strong><div id="userEmail" class="user"></div></div><button class="btn secondary" style="max-width:160px" onclick="logout()">Déconnexion</button></div><div class="apps" id="apps"></div><div class="foot">Ajoutez de nouvelles applications dans la constante APPS du fichier index.html.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const AUTH_SUPABASE_URL = "https://erzuvpswagzwlrxgctaj.supabase.co";
const AUTH_SUPABASE_KEY = "sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr";
const APPS = [
 {
   name: "CNC Calculator",
   short: "CNC",
   description: "Calculs et bibliothèques CNC",
   url: "/cnc/"
 },
 {
   name: "Hot Stamping",
   short: "HS",
   description: "Paramètres et bibliothèques marquage à chaud",
   url: "/hot-stamping/"
 },
{
  name: 'Laser',
  short: 'LS',
  description: 'Paramètres et bibliothèques laser',
  url: '/laser/'
}
];
const auth = window.supabase.createClient(AUTH_SUPABASE_URL, AUTH_SUPABASE_KEY);
const $ = id => document.getElementById(id);
function msg(text, ok=false){$('authMsg').textContent=text || ''; $('authMsg').className=ok?'msg ok':'msg';}
async function signup(){msg('');const email=$('email').value.trim();const password=$('password').value;if(!email||!password){msg('Saisissez email et mot de passe.');return;}const {data,error}=await auth.auth.signUp({email,password});if(error){msg(error.message);return;}if(data.session){await showDashboard(data.session);}else{msg('Compte créé. Si la confirmation email est activée dans Supabase, vérifiez votre boîte mail.', true);}}
async function login(){msg('');const email=$('email').value.trim();const password=$('password').value;if(!email||!password){msg('Saisissez email et mot de passe.');return;}const {data,error}=await auth.auth.signInWithPassword({email,password});if(error){msg(error.message);return;}await showDashboard(data.session);}
async function resetPassword(){msg('');const email=$('email').value.trim();if(!email){msg('Saisissez votre email.');return;}const {error}=await auth.auth.resetPasswordForEmail(email,{redirectTo:location.href});msg(error?error.message:'Email de réinitialisation envoyé si le compte existe.',!error);}
async function logout(){await auth.auth.signOut();$('dashboard').classList.add('hidden');$('authCard').classList.remove('hidden');$('password').value='';}
function renderApps(){const host=$('apps');host.innerHTML=APPS.map(a=>`<a class="app-card" href="${a.url}"><div class="icon">${a.short}</div><h2>${a.name}</h2><p>${a.description}</p></a>`).join('');}
async function showDashboard(session){$('authCard').classList.add('hidden');$('dashboard').classList.remove('hidden');$('userEmail').textContent=session?.user?.email||'';renderApps();}
(async()=>{const {data}=await auth.auth.getSession();if(data.session)showDashboard(data.session);})();
</script></body></html>
