<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manufacturing Tools Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js"></script><style>body{background:#d8d8d3;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px}.wrap{max-width:1220px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:36px}.pill,.logout{border:1px solid #8d8d86;background:#f6f6f2;border-radius:999px;padding:12px 16px;font-weight:850}.logout{background:#1d1d1b;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#eeeeea;border:1px solid #8d8d86;border-radius:22px;padding:24px;text-decoration:none;color:#1d1d1b;min-height:250px}.card img{width:72px;height:72px;border-radius:18px}.card h2{font-size:30px}.card p{font-size:21px;color:#5f5f58}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Manufacturing Tools Hub</h1><p>CNC, Hot Stamping, Laser</p></div><div><span class="pill" id="rolePill">Connexion...</span> <button class="logout" onclick="window.appAuth.signOut()">Déconnexion</button></div></div><div class="grid"><a class="card" href="/cnc/"><img src="cnc/icon-192.png"><h2>CNC Calculator</h2><p>Matières, outils et paramètres d’usinage.</p></a><a class="card" href="/hot-stamping/"><img src="hot-stamping/icon-192.png"><h2>Hot Stamping Calculator</h2><p>Supports, folios et réglages de marquage.</p></a><a class="card" href="/laser/"><img src="laser/icon-192.png"><h2>Laser Calculator</h2><p>Matières, opérations et paramètres laser.</p></a></div></div><script>window.authReady.then(async()=>{const u=await window.appAuth.getUser();const r=await window.appAuth.getRole();document.getElementById('rolePill').textContent=(u?.email||'Non connecté')+' · '+r;});</script></body></html>
