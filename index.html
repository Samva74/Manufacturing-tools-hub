<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
:root{--bg:#d8d8d3;--card:#eeeeea;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--card2:#f6f6f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:28px}.wrap{max-width:1220px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:58px}h1{font-size:42px;margin:36px 0 0;font-weight:900}.subtitle{font-size:21px;margin:28px 0 0;color:#000}.actions{display:flex;gap:8px;align-items:center;margin-top:50px}.pill,.logout{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:16px 24px;font-weight:900;font-size:20px;cursor:pointer}.logout{background:#1d1d1b;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;text-decoration:none;color:var(--txt);min-height:415px}.card img{width:90px;height:90px;border-radius:20px;margin-bottom:36px}.card h2{font-size:40px;line-height:1.2;margin:0 0 34px;font-weight:900}.card p{font-size:28px;line-height:1.35;color:var(--muted);margin:0}
@media(max-width:900px){
  body{padding:16px}
  .top{flex-direction:column}
  .actions{margin-top:10px}
  .grid{grid-template-columns:1fr}

  .card{
    min-height:90px;
    padding:16px;
  }

  .card img{
    width:55px;
    height:55px;
    margin-bottom:10px;
  }

  .card h2{
    font-size:24px;
    margin-bottom:8px;
  }

  .card p{
    font-size:16px;
    line-height:1.2;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Tool App</h1>
      <div class="subtitle">CNC, Hot Stamping, Laser</div>
    </div>
    <div class="actions">
      <button class="pill" id="loginButton" onclick="window.appAuth.showLogin()">Connexion...</button>
      <button class="logout" onclick="window.appAuth.signOut()">Déconnexion</button>
    </div>
  </div>
  <div class="grid">
    
    <a class="card" href="/cnc/">

  <img src="cncpng

  <div class="card-text">
    <h2>CNC Calculator</h2>
    <p>Matières, outils et paramètres d’usinage.</p>
  </div>

</a>
  
   <a classmping/

  <img src="hot-stamping/icon  <div class="card-text">
    <h2>Hot Stamping Calculator</h2>
    <p>Supports, folios et réglages de marquage.</p>
  </div>

</a>
  
<a class="card" href="/laserg

  <div class="card-text">
    <h2>Laser Calculator</h2>
    <p>Matières, opérations et paramètres laser.</p>
  </div>

</a>
  
  </div>
</div>
<script>
window.authReady.then(async()=>{
  const u = await window.appAuth.getUser();
  const r = await window.appAuth.getRole();
  const btn = document.getElementById('loginButton');
  if(u){ btn.textContent = u.email + ' · ' + r; btn.onclick = null; }
  else { btn.textContent = 'Connexion'; btn.onclick = () => window.appAuth.showLogin(); }
});
</script>
</body>
</html>
