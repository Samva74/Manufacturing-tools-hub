function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function goHub(){location.href='/'}function setLang(l){lang=l;localStorage.setItem('laser_lang',l);refreshText()}function setQuality(q){quality=q;document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('active',b.dataset.q===q));calc()}function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillMachines();fillMaterials();setQuality(quality)}function fillMachines(){let s=$('machine'),v=s.value;s.innerHTML='';machines.forEach(m=>s.add(new Option(m.name,m.name)));if(v)s.value=v}function fillMaterials(){let s=$('material'),v=s.value;s.innerHTML='';Object.entries(materials).forEach(([k,m])=>s.add(new Option(m.n[lang],k)));if(materials[v])s.value=v;fillOps()}function fillOps(){let s=$('operation'),v=s.value,m=materials[$('material').value];s.innerHTML='';Object.keys(m.ops).forEach(k=>s.add(new Option(OP[k][lang],k)));if(m.ops[v])s.value=v}function calc(){let m=materials[$('material').value],o=m.ops[$('operation').value];let t=+$('thickness').value||3,p=o.p,s=o.s,passes=o.passes;if($('operation').value==='cut'){let r=Math.max(.4,Math.min(2.2,t/3));p=Math.min(100,p*Math.sqrt(r));s=s/r;if(t>6)passes=Math.max(2,passes)}if(quality==='speed'){p=Math.min(100,p+5);s*=1.2}else if(quality==='quality'){p=Math.max(1,p-5);s*=.8}$('rPower').textContent=Math.round(p);$('rSpeed').textContent=s.toFixed(s<20?1:0);$('rPasses').textContent=passes;$('rFreq').textContent=o.freq+' Hz/PPI';$('rFocus').textContent=o.z+' mm';$('rAir').textContent=o.air;$('rEnergy').textContent=(p/Math.max(s,1)).toFixed(2);$('materialNote').textContent=m.note[lang];useCalculated(false)}function useCalculated(show=true){$('valPower').value=$('rPower').textContent;$('valSpeed').value=$('rSpeed').textContent;$('valPasses').value=$('rPasses').textContent;$('valFocus').value=$('rFocus').textContent.replace(' mm','');if(show)toast('Valeurs reprises')}function addMachine(){toast('Ajout machine: prochaine étape Supabase')}function addMaterial(){toast('Ajout matière: prochaine étape Supabase')}function addParameter(){toast('Ajout paramètre: prochaine étape Supabase')}async function saveCalibration(){try{await q('Laser_calibrations',{m:'POST',b:{material:$('material').value,operation:$('operation').value,machine:$('machine').value,thickness_mm:+$('thickness').value,power_percent:+$('valPower').value,speed_mm_s:+$('valSpeed').value,passes:+$('valPasses').value,z_offset:+$('valFocus').value,comments:$('comments').value}});toast('Calibration enregistrée');loadCalibrations()}catch(e){toast('Erreur Supabase')}}async function loadCalibrations(){let host=$('calibs');host.innerHTML='';try{let rows=await q('Laser_calibrations',{q:'?select=*&order=created_at.desc&limit=20'});if(!rows.length){host.innerHTML='<p class="unit">Aucune calibration chargée.</p>';return}rows.forEach(r=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="t">${r.material||''} · ${r.operation||''}</div><div class="s">${r.power_percent||'-'}% · ${r.speed_mm_s||'-'} mm/s · ${r.passes||'-'} passes</div>`;host.appendChild(d)})}catch(e){host.innerHTML='<p class="unit">Supabase non chargé.</p>'}}
