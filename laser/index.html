      async function token() {
        return (await sb.auth.getSession()).data.session?.access_token || SUPABASE_KEY
      }
      async function api(table, opt = {}) {
        let r = await fetch(SUPABASE_URL + '/rest/v1/' + table + (opt.q || ''), {
          method: opt.m || 'GET',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + await token(),
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          },
          body: opt.b ? JSON.stringify(opt.b) : undefined
        });
        if (!r.ok) throw new Error(await r.text());
        return r.json()
      }

      function toast(t) {
        let e = $('toast');
        e.textContent = t;
        e.style.display = 'block';
        setTimeout(() => e.style.display = 'none', 2200)

}

        refreshText()
      }

      function refreshText() {
        document.querySelectorAll('[data-t]').forEach(e => e.textContent = TXT[lang][e.dataset.t] || TXT.fr[e.dataset.t] || '');
        document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        fillLists();
        calc()
      }

                }
            );

      async function loadAllRows(
    tableName,
    orderExpression
) {

    const pageSize = 500;

    let offset = 0;

    let allRows = [];

    while (true) {

        const page = await api(
            tableName,
            {
                q:
                    '?select=*' +
                    '&order=' +
                    orderExpression +
                    '&limit=' +
                    pageSize +
                    '&offset=' +
                    offset
            }
        );

        if (!Array.isArray(page)) {

            throw new Error(
                'Reponse invalide pour la table ' +
                tableName
            );

        }

        allRows.push(
            ...page
        );

        if (page.length < pageSize) {

            break;

        }

        offset += pageSize;

    }

    return allRows;

}

    if (!canWriteSelectedSite()) {

    toast(
        role === 'expert_site'
            ? 'Lecture seule sur ce site'
            : (
                TXT[lang].editPermissionRequired ||
                TXT.fr.editPermissionRequired
            )
    );

    return;
}


    /* =========================================
       2. RECHERCHE DU PARAMÈTRE ACTUEL
       Machine + Matière + Opération
       ========================================= */

const parameter = sp();

/* ----------------------------------
   Vérifie que ce n'est pas
   un ancien paramètre générique
---------------------------------- */

if (
    parameter &&
    !parameter.machine_id
) {

    toast(
        TXT[lang].legacyParameter ||
        TXT.fr.legacyParameter
    );

    return;

}

if (!parameter || !parameter.id) {

    toast(
        TXT[lang].parameterNotFound ||
        TXT.fr.parameterNotFound
    );

    return;

}


    /* =========================================
       3. LECTURE DES VALEURS
       ========================================= */

    const powerValue =
        $('cTemp').value.trim();

    const speedValue =
        $('cPress').value.trim();

    const passesValue =
        $('cDwell').value.trim();


    /* =========================================
       4. VALIDATION DES CHAMPS
       ========================================= */

    if (
        powerValue === '' ||
        speedValue === '' ||
        passesValue === ''
    ) {

        toast(
            TXT[lang].parameterInvalid ||
            TXT.fr.parameterInvalid
        );

        return;

    }


    const newPower =
        Number(powerValue);

    const newSpeed =
        Number(speedValue);

    const newPasses =
        Number(passesValue);


    if (
        !Number.isFinite(newPower) ||
        !Number.isFinite(newSpeed) ||
        !Number.isFinite(newPasses) ||

        newPower < 0 ||
        newPower > 100 ||

        newSpeed < 0 ||

        newPasses < 1 ||
        !Number.isInteger(newPasses)
    ) {

        toast(
            TXT[lang].parameterInvalid ||
            TXT.fr.parameterInvalid
        );

        return;

    }


    /* =========================================
       5. MÉMORISATION DES ANCIENNES VALEURS
       POUR LA TRAÇABILITÉ
       ========================================= */

    const oldPower =
        parameter.power_percent;

    const oldSpeed =
        parameter.speed_mm_s;

    const oldPasses =
        parameter.passes;

    const oldQuality =
        parameter.quality;


    /* =========================================
       6. DONNÉES À ENREGISTRER
       ========================================= */

    const updateData = {

    site_id:
    Number(
        $('site').value
    ),
      thickness_mm:
        $('thickness').value === ''
            ? null
            : Number(
                $('thickness').value
            ),

    power_percent:
        newPower,

    speed_mm_s:
        newSpeed,

    passes:
        newPasses,

    quality:
        'validated',

    updated_by_user_id:
        user?.id || null,

    updated_by_email:
        user?.email || null,

    updated_at:
        new Date().toISOString()

};


    try {

        /* =====================================
           7. MISE À JOUR DANS SUPABASE
           ===================================== */

        const savedRows = await api(
            'laser_parameters',
          
            {
                q:
                    '?id=eq.' +
                    encodeURIComponent(
                        parameter.id
                    ),

                m:
                    'PATCH',

                b:
                    updateData

            }
        );


        /* =====================================
           8. ACTUALISATION DE LA COPIE LOCALE
           ===================================== */

        const savedParameter =
            Array.isArray(savedRows) &&
            savedRows.length

                ? savedRows[0]
                : updateData;


        Object.assign(
            parameter,
            savedParameter
        );


        /* =====================================
           9. HISTORIQUE DES MODIFICATIONS
           ===================================== */

        if (oldPower !== newPower) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'power_percent',
                oldPower,
                newPower
            );

        }


        if (oldSpeed !== newSpeed) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'speed_mm_s',
                oldSpeed,
                newSpeed
            );

        }


        if (oldPasses !== newPasses) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'passes',
                oldPasses,
                newPasses
            );

        }


        if (oldQuality !== 'validated') {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'quality',
                oldQuality,
                'validated'
            );

        }


        /* =====================================
           10. HISTORIQUE DE CALIBRATION
           Le commentaire reste conservé dans
           Laser_calibrations.
           ===================================== */

        const selectedMachine =
            machines.find(
                machine =>
                    String(machine.id) ===
                    String($('machine').value)
            );


        try {

            await api(
                'Laser_calibrations',
                {
                    m:
                        'POST',

                    b: {

    material:
        $('material').value,

    thickness_mm:
        $('thickness').value === ''
            ? null
            : Number(
                $('thickness').value
            ),

    operation:
        $('operation').value,

    machine:
        selectedMachine
            ? selectedMachine.name
            : '',

    power_percent:
        newPower,

                        speed_mm_s:
                            newSpeed,

                        passes:
                            newPasses,

                        comments:
                            $('comments').value,

                        created_by_user_id:
                            user?.id || null,

                        created_by_email:
                            user?.email || null

                    }

                }
            );

        } catch (historyError) {

            console.warn(
                'Historique calibration non enregistré',
                historyError
            );

        }


        /* =====================================
           11. RAFRAÎCHISSEMENT IMMÉDIAT
           ===================================== */

        calc();

        // await loadCalibs();


        toast(
            TXT[lang].parameterSaved ||
            TXT.fr.parameterSaved
        );

    } catch (error) {

        console.error(
            'saveParameter',
            error
        );

        toast(
            TXT[lang].parameterSaveError ||
            TXT.fr.parameterSaveError
        );

    }

}
      async function loadCalibs() {

        h.innerHTML = '';

          let rows = await api('Laser_calibrations', {
            q: '?select=*&order=created_at.desc&limit=20'
          });
          if (!rows.length) {
            h.innerHTML = '<p>Aucune calibration.</p>';
            return
          }
          rows.forEach(row => {

    const material = materials.find(
        item =>
            item.code === row.material
    );

    const materialLabel =

        material
            ? loc(material, 'name')
            : row.material || '';


    const operationLabel =

        TXT[lang][row.operation] ||

        TXT.fr[row.operation] ||

        row.operation ||

        '';


    const machineLabel =
        row.machine || '';


    const powerLabel =

        row.power_percent !== null &&
        row.power_percent !== undefined

            ? row.power_percent + ' %'
            : '–';


    const speedLabel =

        row.speed_mm_s !== null &&
        row.speed_mm_s !== undefined

            ? row.speed_mm_s + ' mm/s'
            : '–';


    const passesLabel =

        row.passes !== null &&
        row.passes !== undefined

            ? row.passes +
              ' ' +

                  TXT[lang].passesUnit ||
                  TXT.fr.passesUnit
              )

            : '–';


    const item =
        document.createElement('div');


    item.className =
        'item';


    item.innerHTML = `

        <b>
            ${materialLabel}
            ·
            ${operationLabel}
        </b>

        <div class="s">

            ${machineLabel}

            <br>

            ${powerLabel}
            ·
            ${speedLabel}
            ·
            ${passesLabel}

            <br>

            ${row.created_by_email || row.operator || ''}

        </div>

    `;


    if (row.comments) {

        const comments =
            document.createElement('div');

        comments.className =
            'calibration-comments';

        comments.textContent =
            row.comments;

        item.appendChild(
            comments
        );

    }


    $('calibs').appendChild(
        item
    );

});
        } catch (e) {
          h.innerHTML = '<p>Supabase non chargé.</p>'
        }
      }

async function saveNewLaserParameter() {

    if (!canWriteSelectedSite()) {

        toast(
            TXT[lang].editPermissionRequired ||
            TXT.fr.editPermissionRequired
        );

        return;

    }

    try {

        let machineId =
            $('newParameterMachine').value;

        let materialCode =
            $('newParameterMaterial').value;


        /* =========================================
           VALEURS DU PARAMÈTRE
           ========================================= */

        const thickness =
            Number(
                $('newParameterThickness').value
            );

        const operation =
            $('newParameterOperation').value;

        const power =
            Number(
                $('newParameterPower').value
            );

        const speed =
            Number(
                $('newParameterSpeed').value
            );

        const passes =
            Number(
                $('newParameterPasses').value
            );


        /* =========================================
           VALIDATION DU PARAMÈTRE
           ========================================= */

        if (
            !Number.isFinite(thickness) ||
            thickness <= 0
        ) {

            toast(
                'Renseigne une épaisseur valide'
            );

            $('newParameterThickness').focus();

            return;

        }

        if (!operation) {

            toast(
                'Sélectionne une opération'
            );

            return;

        }

        if (
            !Number.isFinite(power) ||
            power < 0 ||
            power > 100
        ) {

            toast(
                'La puissance doit être comprise entre 0 et 100 %'
            );

            $('newParameterPower').focus();

            return;

        }

        if (
            !Number.isFinite(speed) ||
            speed < 0
        ) {

            toast(
                'Renseigne une vitesse valide'
            );

            $('newParameterSpeed').focus();

            return;

        }

        if (
            !Number.isInteger(passes) ||
            passes < 1
        ) {

            toast(
                'Le nombre de passes doit être un nombre entier supérieur à zéro'
            );

            $('newParameterPasses').focus();

            return;

        }


        /* =========================================
           CRÉATION D’UNE NOUVELLE MACHINE
           ========================================= */

        if ($('createNewMachine').checked) {

            const machineName =
                $('newLaserMachineName')
                    .value
                    .trim();

            const machineWatt =
                Number(
                    $('newLaserMachineWatt').value
                );

            if (!machineName) {

                toast(
                    'Le nom de la machine est obligatoire'
                );

                $('newLaserMachineName').focus();

                return;

            }

            if (
                !Number.isFinite(machineWatt) ||
                machineWatt <= 0
            ) {

                toast(
                    'La puissance de la machine doit être supérieure à zéro'
                );

                $('newLaserMachineWatt').focus();

                return;

            }

            const machineRows =
                await api(
                    'laser_machines',
                    {
                        m: 'POST',

                        b: {

                            name:
                                machineName,

                            watt:
                                machineWatt,

                            lens:
                                $('newLaserMachineLens')
                                    .value
                                    .trim() || null,

                            site:
                                $('newLaserMachineSite')
                                    .value
                                    .trim() || null,

                            created_by_user_id:
                                user?.id || null,

                            created_by_email:
                                user?.email || null

                        }

                    }
                );

            if (
                !Array.isArray(machineRows) ||
                !machineRows.length ||
                !machineRows[0].id
            ) {

                throw new Error(
                    'La machine a été créée sans identifiant exploitable'
                );

            }

            machineId =
                String(
                    machineRows[0].id
                );

        }


        /* =========================================
           VALIDATION MACHINE EXISTANTE
           ========================================= */

        if (!machineId) {

            toast(
                'Sélectionne une machine'
            );

            return;

        }


        /* =========================================
           CRÉATION D’UNE NOUVELLE MATIÈRE
           ========================================= */

        if ($('createNewMaterial').checked) {

            const materialNameFr =
                $('newLaserMaterialNameFr')
                    .value
                    .trim();

            const enteredCode =
                $('newLaserMaterialCode')
                    .value
                    .trim();

            materialCode =
                enteredCode
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(
                        /[\u0300-\u036f]/g,
                        ''
                    )
                    .replace(
                        /[^a-z0-9]+/g,
                        '_'
                    )
                    .replace(
                        /^_+|_+$/g,
                        ''
                    );

            if (!materialCode) {

                toast(
                    'Le code matière est obligatoire'
                );

                $('newLaserMaterialCode').focus();

                return;

            }

            if (!materialNameFr) {

                toast(
                    'Le nom français de la matière est obligatoire'
                );

                $('newLaserMaterialNameFr').focus();

                return;

            }

            await api(
                'laser_materials',
                {
                    m: 'POST',

                    b: {

                        code:
                            materialCode,

                        name_fr:
                            materialNameFr,

                        name_en:
                            $('newLaserMaterialNameEn')
                                .value
                                .trim() || null,

                        name_pt:
                            $('newLaserMaterialNamePt')
                                .value
                                .trim() || null,

                        family:
                            $('newLaserMaterialFamily')
                                .value
                                .trim() || null,

                        note:
                            $('newLaserMaterialNote')
                                .value
                                .trim() || null,

                        created_by_user_id:
                            user?.id || null,

                        created_by_email:
                            user?.email || null

                    }

                }
            );

        }


        /* =========================================
           VALIDATION MATIÈRE EXISTANTE
           ========================================= */

        if (!materialCode) {

            toast(
                'Sélectionne une matière'
            );

            return;

        }


        /* =========================================
           CONTRÔLE D’UN DOUBLON
           ========================================= */

        const selectedSiteId =
    String($('site').value);

const existingParameter =
    params.find(
        parameter => {

            return (

                String(
                    parameter.site_id || ''
                ) === selectedSiteId

                &&

                String(
                    parameter.machine_id || ''
                ) === String(machineId)

                &&

                parameter.material_code ===
                    materialCode

                &&

                Number(
                    parameter.thickness_mm
                ) === thickness

                &&

                parameter.operation ===
                    operation
            );
        }
    );

        if (existingParameter) {

            toast(
                'Ce paramètre existe déjà. Modifie-le depuis Calibration atelier.'
            );

            return;

        }


        /* =========================================
           CRÉATION DU PARAMÈTRE LASER
           ========================================= */

        const parameterRows =
    await api(
        'laser_parameters',
        {
            m: 'POST',

            b: {

                site_id:
                    Number(
                        $('site').value
                    ),

                machine_id:
                    machineId,

                material_code:
                    materialCode,

                        thickness_mm:
                            thickness,

                        operation:
                            operation,

                        power_percent:
                            power,

                        speed_mm_s:
                            speed,

                        passes:
                            passes,

                        quality: 'to_validate',

                        created_by_user_id:
                            user?.id || null,

                        created_by_email:
                            user?.email || null,

                        updated_by_user_id:
                            user?.id || null,

                        updated_by_email:
                            user?.email || null,

                        updated_at:
                            new Date().toISOString()

                    }

                }
            );


        /* =========================================
           TRAÇABILITÉ
           ========================================= */

        const newParameterId =
            Array.isArray(parameterRows) &&
            parameterRows.length

                ? parameterRows[0].id

                : '';

        await audit(
            'laser_parameters',
            newParameterId,
            'create',
            'parameter',
            '',
            [
                machineId,
                materialCode,
                thickness + ' mm',
                operation,
                power + ' %',
                speed + ' mm/s',
                passes + ' passes'
            ].join(' · ')
        );


        /* =========================================
           RECHARGEMENT DES BIBLIOTHÈQUES
           ========================================= */

        await loadLibraries();

        fillLists();


        /* Sélection du nouveau paramètre */

        $('machine').value =
            String(machineId);

        $('material').value =
            materialCode;

        fillThicknessList();

        $('thickness').value =
            String(thickness);

        fillOperationList();

        $('operation').value =
            operation;

        calc();


        /* =========================================
           FERMETURE ET NETTOYAGE
           ========================================= */

        closeLaserParameterModal();

        resetLaserParameterModal();

        toast(
            'Paramètre Laser créé'
        );

    } catch (error) {

        console.error(
            'saveNewLaserParameter',
            error
        );

        toast(
            'Erreur création paramètre Laser'
        );

    }

}

function resetLaserParameterModal() {

    $('createNewMachine').checked = false;

    $('createNewMaterial').checked = false;

    $('newMachineFields').style.display = 'none';

    $('newMaterialFields').style.display = 'none';

    [
        'newLaserMachineName',
        'newLaserMachineWatt',
        'newLaserMachineLens',
        'newLaserMachineSite',
        'newLaserMaterialCode',
        'newLaserMaterialNameFr',
        'newLaserMaterialNameEn',
        'newLaserMaterialNamePt',
        'newLaserMaterialFamily',
        'newLaserMaterialNote',
        'newParameterThickness',
        'newParameterPower',
        'newParameterSpeed',
        'newParameterComments'
    ].forEach(
        id => {

            const element =
                $(id);

            if (element) {

                element.value = '';

            }

        }
    );

    $('newParameterPasses').value = '1';

    $('newParameterOperation').value = 'cut';

}
