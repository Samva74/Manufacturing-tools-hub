    <style>
      :root {
        --bg: #d8d8d3;
        --card: #eeeeea;
        --card2: #f6f6f2;
        --line: #8d8d86;
        --txt: #1d1d1b;
        --muted: #5f5f58;
        --accent: #1d1d1b;
        --ok: #237a3b;
        --soft: #e5e5df;
        --valid: #d9eadb
      }

      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 18px
      }

      .wrap {
        max-width: 1180px;
        margin:auto;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px
      }

      .logo {
        width: 76px;
        height: 76px;
        border: 2px solid var(--txt);
        border-radius: 20px;
        background: #e0e1dd;
        display: grid;
        place-items: center
      }

      .logo svg {
        width: 54px;
        height: 54px
      }

      .title h1 {
        margin: 0;
        font-size: 31px
      }

      .title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px
      }

      .top-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

      .hub-btn,
      .langs button,
      .role-pill {
        border: 1px solid var(--line);
        background: var(--card2);
        border-radius: 999px;
        padding: 10px 14px;
        color: var(--txt);
        font-weight: 850;
        text-decoration: none
      }

.role-pill{
    display:flex;
    align-items:center;
    justify-content:center;

    height:42px;
    font-size:15px;
    padding:8px 12px;
}

.hub-btn{
    display:flex;
    align-items:center;
    justify-content:center;

    height:42px;
    min-width:95px;
}

.langs button{
    height:42px;
    min-width:95px;
}
      
      .langs button.active{
        background: var(--accent);
        color: white
      }

     .layout{
    display:grid;
    grid-template-columns:48% 52%;
    gap:14px;
    align-items:start;
}

      .col{
        display: flex;
        flex-direction: column;
        gap: 14px
      }

      .col{
    align-self:start;
}

      .card{
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .12)
      }

      h2{
        display: flex;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 18px
      }

      .dot{
        width: 10px;
        height: 10px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--accent)
      }

      label{
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
        margin: 10px 0 5px
      }

     .row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

      .inputline{
        display: flex;
        gap: 8px;
        align-items: stretch
      }

.input-unit{
    position:relative;
}

.input-unit input{
    padding-right:70px;
    font-weight:700;
}

.unit{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:var(--txt);
    font-weight:700;
    font-size:14px;
}


      select,
      input,
      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: white;
        color: var(--txt);
        font-size: 15px
      }

      textarea {
        min-height: 78px
      }

      .search-btn,
      .mini-plus {
        height: 46px;
        min-width: 46px;
        border-radius: 14px;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer
      }

      .search-btn {
        border: 1px solid var(--line);
        background: white
      }

      .mini-plus {
        border: none;
        background: var(--accent);
        color: white;
        display: none
      }

      .can-edit .mini-plus {
        display: flex
      }

      .res-big {
        border: 1px solid var(--line);
        background: var(--soft);
        border-radius: 18px;
        padding: 13px;
        margin: 10px 0
      }

      .res-big.valid {
        background: var(--valid);
        border-color: var(--ok)
      }

      .res-big .lbl {
        font-size: 13px;
        color: var(--muted)
      }

      .res-big .lbl {
    font-size: 13px;
    color: var(--muted);
}

.res-big .val {
    font-size: 30px;
    font-weight: 900;
}

/* Bloc compact pour Passes */

.res-small {
    border: 1px solid var(--line);
    background: var(--soft);
    border-radius: 18px;
    padding: 8px 13px;
    margin-top: 10px;
}

.res-small .lbl {
    font-size: 13px;
    color: var(--muted);
}

.res-small .val{
    font-size:30px;
    font-weight:900;
    margin-top:6px;
}


      .res-line {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 9px 0
      }

      .note {
        background: rgba(29, 29, 27, .06);
        border-left: 4px solid var(--accent);
        padding: 10px;
        border-radius: 12px;
        margin-top: 10px
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 13px;
        background: var(--accent);
        color: white;
        padding: 13px;
        margin-top: 10px;
        font-weight: 850
      }

      .btn.secondary {
        background: var(--card2);
        color: var(--txt);
        border: 1px solid var(--line)
      }

     .lib{
    margin-top:14px;
    max-height:450px;
    overflow:auto;
}

      .item {
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 11px;
        margin-top: 9px
      }

      .item .s {
        color: var(--muted);
        font-size: 13px
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: #1d1d1b;
        color: white;
        padding: 11px 14px;
        border-radius: 999px;
        display: none;
        z-index: 99
      }

      .foot {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        text-align: center
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .28);
        display: none;
        z-index: 9998;
        align-items: center;
        justify-content: center;
        padding: 16px
      }

      .modal.open {
        display: flex
      }

      .modal-panel {
        width: min(560px, 100%);
        max-height: 82vh;
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px
      }

      .modal-head {
        display: flex;
        justify-content: space-between
      }

      .close {
        border: 1px solid var(--line);
        background: var(--card2);
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 900
      }

      .result {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
        margin-top: 8px;
        cursor: pointer
      }

      .result:hover {
        background: var(--valid)
      }
      
body:not(.can-edit) .parameter-save-btn{

    cursor:not-allowed;
}

    padding-top: 8px;
    border-top: 1px solid var(--line);
    color: var(--txt);
    font-size: 13px;
    white-space: pre-wrap;
}

  .langs button{
    height:40px;
  }

}

.status{

    <script>

      const SUPABASE_URL = 'https://erzuvpswagzwlrxgctaj.supabase.co',
        SUPABASE_KEY = 'sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const $ = id => document.getElementById(id);
      let lang = localStorage.getItem(APP + '_lang') || 'fr',
        user = null,
        role = 'user';
      const canEdit = () => ['expert', 'admin'].includes(role);
      async function token() {
        return (await sb.auth.getSession()).data.session?.access_token || SUPABASE_KEY
      }
      async function api(table, opt = {}) {
        let r = await fetch(SUPABASE_URL + '/rest/v1/' + table + (opt.q || ''), {
          method: opt.m || 'GET',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + await token(),
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          },
          body: opt.b ? JSON.stringify(opt.b) : undefined
        });
        if (!r.ok) throw new Error(await r.text());
        return r.json()
      }

      function toast(t) {
        let e = $('toast');
        e.textContent = t;
        e.style.display = 'block';
        setTimeout(() => e.style.display = 'none', 2200)
      }

      function goHub() {
        location.href = '/'
      }

      function setLang(l) {
        lang = l;
        localStorage.setItem(APP + '_lang', l);
        refreshText()
      }

      function refreshText() {
        document.querySelectorAll('[data-t]').forEach(e => e.textContent = TXT[lang][e.dataset.t] || TXT.fr[e.dataset.t] || '');
        document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        fillLists();
        calc()
      }
      async function initAuth() {
        await window.authReady;
        user = await window.appAuth.getUser();
        role = await window.appAuth.getRole();
        let rp = $('rolePill');
        if (rp) rp.textContent = (user?.email || '');
        if (canEdit()) document.body.classList.add('can-edit')
      }
      async function audit(table, record, action, field, oldv, newv) {
        try {
          await api('library_history', {
            m: 'POST',
            b: {
              application: APP,
              table_name: table,
              record_id: String(record || ''),
              action,
              field_name: field || '',
              old_value: String(oldv || ''),
              new_value: String(newv || ''),
              user_id: user?.id,
              user_email: user?.email
            }
          })
        } catch (e) {
          console.warn('audit', e)
        }
      }

      function openSearch(title, items, onPick) {
        let m = $('searchModal'),
          q = $('searchInput'),
          list = $('searchResults');
        $('searchTitle').textContent = title;
        q.value = '';

        function render() {
          let term = q.value.toLowerCase().trim();
          let rows = items.filter(x => !term || x.search.toLowerCase().includes(term)).slice(0, 60);
          list.innerHTML = rows.map((x, i) => `<div class="result"><b>${x.title}</b><div class="s">${x.sub||''}</div></div>`).join('') || '<p>Aucun résultat.</p>';
          [...list.children].forEach((el, i) => el.onclick = () => {
            onPick(rows[i].value);
            closeSearch()
          })
        }
        q.oninput = render;
        $('searchClose').onclick = closeSearch;
        m.classList.add('open');
        setTimeout(() => q.focus(), 50);
        render()
      }

      function closeSearch() {
        $('searchModal').classList.remove('open')

      let materials = [],

      async function loadLibraries() {
        materials = await api('laser_materials', {
          q: '?select=*&order=name_fr.asc'
        });
        params = await api('laser_parameters', {
          q: '?select=*&order=material_code.asc'
        });
        machines = await api('laser_machines', {
          q: '?select=*&order=name.asc'
        });
        if (!machines.length) machines = [{
          name: 'Générique CO₂ 80W'
        }]
      }

      function loc(r, b) {
        return r[b + '_' + lang] || r[b + '_fr'] || r[b] || ''
      }

      function fillLists() {

    /* =========================================
       MACHINE
       La valeur du menu est maintenant l’ID
       Supabase de la machine.
       ========================================= */

    const machineSelect = $('machine');
    const previousMachineId = machineSelect.value;

    machineSelect.innerHTML = '';

    machines.forEach(machine => {

        const option = new Option(
            machine.name,
            String(machine.id)
        );

        machineSelect.add(option);

    });

    if (
        previousMachineId &&
        machines.some(
            machine =>
                String(machine.id) === previousMachineId
        )
    ) {
        machineSelect.value = previousMachineId;
    }


    /* =========================================
       MATIÈRE
       ========================================= */

    const materialSelect = $('material');
    const previousMaterialCode = materialSelect.value;

    materialSelect.innerHTML = '';

    materials.forEach(material => {

        const option = new Option(
            loc(material, 'name'),
            material.code
        );

        materialSelect.add(option);

    });

    if (
        previousMaterialCode &&
        materials.some(
            material =>
                material.code === previousMaterialCode
        )
    ) {
        materialSelect.value = previousMaterialCode;
    }


    /* =========================================
       OPÉRATIONS DISPONIBLES
       Filtrées par machine + matière
       ========================================= */

    fillOperationList();

}

function fillOperationList() {

    const operationSelect = $('operation');

    const selectedMachineId =
        String($('machine').value || '');

    const selectedMaterialCode =
        $('material').value;

    const previousOperation =
        operationSelect.value;

    operationSelect.innerHTML = '';


    /* =========================================
       1. PARAMÈTRES DE LA MACHINE SÉLECTIONNÉE
       ========================================= */

    let matchingParameters = params.filter(
        parameter => {

            return (
                String(parameter.machine_id || '') ===
                    selectedMachineId &&

                parameter.material_code ===
                    selectedMaterialCode
            );

        }
    );


    /* =========================================
       2. REPLI SUR LES ANCIENS PARAMÈTRES
       SANS MACHINE

       Ce repli est utilisé uniquement lorsqu’aucun
       paramètre spécifique à la machine n’existe.
       ========================================= */

    if (!matchingParameters.length) {

        matchingParameters = params.filter(
            parameter => {

                return (
                    !parameter.machine_id &&

                    parameter.material_code ===
                        selectedMaterialCode
                );

            }
        );

    }


    /* =========================================
       3. OPÉRATIONS UNIQUES
       ========================================= */

    const availableOperations = [

        ...new Set(

            matchingParameters

                .map(
                    parameter =>
                        parameter.operation
                )

                .filter(Boolean)

        )

    ];


    /* =========================================
       4. AUCUNE OPÉRATION DISPONIBLE
       ========================================= */

    if (!availableOperations.length) {

        operationSelect.add(
            new Option(
                TXT[lang].noOperation ||
                TXT.fr.noOperation,
                ''
            )
        );

        operationSelect.disabled = true;

        calc();

        return;

    }


    operationSelect.disabled = false;


    /* =========================================
       5. AJOUT DES OPÉRATIONS TRADUITES
       ========================================= */

    availableOperations.forEach(
        operationCode => {

            const translatedLabel =

                TXT[lang][operationCode] ||

                TXT.fr[operationCode] ||

                operationCode;


            operationSelect.add(
                new Option(
                    translatedLabel,
                    operationCode
                )
            );

        }
    );


    /* =========================================
       6. CONSERVATION DE L’ANCIEN CHOIX
       ========================================= */

    const previousOperationStillExists = [

        ...operationSelect.options

    ].some(
        option =>
            option.value === previousOperation
    );


    if (previousOperationStillExists) {

        operationSelect.value =
            previousOperation;

    } else {

        operationSelect.selectedIndex = 0;

    }

}
      
     function sp() {

    const selectedMachineId =
        String($('machine').value || '');

    const selectedMaterialCode =
        $('material').value;

    const selectedOperation =
        $('operation').value;


    /* =========================================
       1. PARAMÈTRE SPÉCIFIQUE À LA MACHINE
       ========================================= */

    const machineParameter = params.find(
        parameter => {

            return (
                String(parameter.machine_id || '') ===
                    selectedMachineId &&

                parameter.material_code ===
                    selectedMaterialCode &&

                parameter.operation ===
                    selectedOperation
            );

        }
    );


    if (machineParameter) {

        return machineParameter;

    }


    /* =========================================
       2. REPLI SUR UN ANCIEN PARAMÈTRE
       SANS MACHINE
       ========================================= */

    return params.find(
        parameter => {

            return (
                !parameter.machine_id &&

                parameter.material_code ===
                    selectedMaterialCode &&

                parameter.operation ===
                    selectedOperation
            );

        }
    );

}

      function calc() {

    const parameter = sp();


    /* =========================================
       Aucun réglage trouvé
       ========================================= */

    if (!parameter) {

        $('rTemp').textContent = '–';
        $('rPress').textContent = '–';
        $('rDwell').textContent = '–';

        $('cTemp').value = '';
        $('cPress').value = '';
        $('cDwell').value = '';

        const selectedMaterial = materials.find(
            material =>
                material.code === $('material').value
        );

        $('note').textContent =
            selectedMaterial
                ? selectedMaterial.note || ''
                : '';

        return;

    }


    /* =========================================
       Lecture rapide
       ========================================= */

    $('rTemp').textContent =
        parameter.power_percent !== null &&
        parameter.power_percent !== undefined

            ? parameter.power_percent + ' %'
            : '–';


    $('rPress').textContent =
        parameter.speed_mm_s !== null &&
        parameter.speed_mm_s !== undefined

            ? parameter.speed_mm_s + ' mm/s'
            : '–';


    $('rDwell').textContent =
        parameter.passes !== null &&
        parameter.passes !== undefined

            ? parameter.passes
            : '–';


    /* =========================================
       Calibration atelier
       ========================================= */

    $('cTemp').value =
        parameter.power_percent ?? '';

    $('cPress').value =
        parameter.speed_mm_s ?? '';

    $('cDwell').value =
        parameter.passes ?? '';


    /* =========================================
       Note matière
       ========================================= */

    const selectedMaterial = materials.find(
        material =>
            material.code === $('material').value
    );

    $('note').textContent =
        selectedMaterial
            ? selectedMaterial.note || ''
            : '';

}
      
      function searchMachine() {

    openSearch(

        'Recherche machine',

        machines.map(machine => ({

            title: machine.name,

            sub:
                (machine.watt
                    ? machine.watt + ' W'
                    : '') +

                (machine.site
                    ? ' · ' + machine.site
                    : ''),

            search: [
                machine.name,
                machine.watt,
                machine.lens,
                machine.site
            ].join(' '),

            value: String(machine.id)

        })),

        machineId => {

            $('machine').value = machineId;

            fillOperationList();

            calc();

        }

    );

}
      function searchSupport() {
        searchMaterial()
      }

      function searchFoil() {
        searchParam()
      }

      function searchMaterial() {

    openSearch(

        'Recherche matière',

        materials.map(
            material => ({

                title:
                    loc(material, 'name'),

                sub:
                    material.code +
                    ' · ' +
                    (material.family || ''),

                search: [

                    material.code,
                    loc(material, 'name'),
                    material.family,
                    material.note

                ].join(' '),

                value:
                    material.code

            })
        ),

        materialCode => {

            $('material').value =
                materialCode;

            fillOperationList();

            calc();

        }

    );

}

      function searchParam() {

    const selectedMachineId =
        String($('machine').value || '');


    let searchableParameters = params.filter(
        parameter =>
            String(parameter.machine_id || '') ===
            selectedMachineId
    );


    if (!searchableParameters.length) {

        searchableParameters = params.filter(
            parameter =>
                !parameter.machine_id
        );

    }


    openSearch(

        'Recherche paramètre',

        searchableParameters.map(
            parameter => ({

                title:

                    (
                        loc(
                            materials.find(
                                material =>
                                    material.code ===
                                    parameter.material_code
                            ) || {},
                            'name'
                        ) ||

                        parameter.material_code

                    ) +

                    ' · ' +

                    (
                        TXT[lang][parameter.operation] ||
                        TXT.fr[parameter.operation] ||
                        parameter.operation
                    ),

                sub:

                    (
                        parameter.power_percent ?? '–'
                    ) +

                    '% · ' +

                    (
                        parameter.speed_mm_s ?? '–'
                    ) +

                    ' mm/s',

                search: [

                    parameter.material_code,
                    parameter.operation,
                    parameter.power_percent,
                    parameter.speed_mm_s

                ].join(' '),

                value:
                    String(parameter.id)

            })
        ),

        parameterId => {

            const parameter =
                params.find(
                    item =>
                        String(item.id) ===
                        String(parameterId)
                );


            if (!parameter) {

                return;

            }


            $('material').value =
                parameter.material_code;

            fillOperationList();

            $('operation').value =
                parameter.operation;

            calc();

        }

    );

}

      async function saveParameter() {

    /* =========================================
       1. CONTRÔLE DES DROITS
       ========================================= */

    if (!canEdit()) {

        toast(
            TXT[lang].editPermissionRequired ||
            TXT.fr.editPermissionRequired
        );

        return;

    }


    /* =========================================
       2. RECHERCHE DU PARAMÈTRE ACTUEL
       Machine + Matière + Opération
       ========================================= */

const parameter = sp();

/* ----------------------------------
   Vérifie que ce n'est pas
   un ancien paramètre générique
---------------------------------- */

if (
    parameter &&
    !parameter.machine_id
) {

    toast(
        TXT[lang].legacyParameter ||
        TXT.fr.legacyParameter
    );

    return;

}

if (!parameter || !parameter.id) {

    toast(
        TXT[lang].parameterNotFound ||
        TXT.fr.parameterNotFound
    );

    return;

}


    /* =========================================
       3. LECTURE DES VALEURS
       ========================================= */

    const powerValue =
        $('cTemp').value.trim();

    const speedValue =
        $('cPress').value.trim();

    const passesValue =
        $('cDwell').value.trim();


    /* =========================================
       4. VALIDATION DES CHAMPS
       ========================================= */

    if (
        powerValue === '' ||
        speedValue === '' ||
        passesValue === ''
    ) {

        toast(
            TXT[lang].parameterInvalid ||
            TXT.fr.parameterInvalid
        );

        return;

    }


    const newPower =
        Number(powerValue);

    const newSpeed =
        Number(speedValue);

    const newPasses =
        Number(passesValue);


    if (
        !Number.isFinite(newPower) ||
        !Number.isFinite(newSpeed) ||
        !Number.isFinite(newPasses) ||

        newPower < 0 ||
        newPower > 100 ||

        newSpeed < 0 ||

        newPasses < 1 ||
        !Number.isInteger(newPasses)
    ) {

        toast(
            TXT[lang].parameterInvalid ||
            TXT.fr.parameterInvalid
        );

        return;

    }


    /* =========================================
       5. MÉMORISATION DES ANCIENNES VALEURS
       POUR LA TRAÇABILITÉ
       ========================================= */

    const oldPower =
        parameter.power_percent;

    const oldSpeed =
        parameter.speed_mm_s;

    const oldPasses =
        parameter.passes;

    const oldQuality =
        parameter.quality;


    /* =========================================
       6. DONNÉES À ENREGISTRER
       ========================================= */

    const updateData = {

        power_percent:
            newPower,

        speed_mm_s:
            newSpeed,

        passes:
            newPasses,

        quality:
            'validated',

        updated_by_user_id:
            user?.id || null,

        updated_by_email:
            user?.email || null,

        updated_at:
            new Date().toISOString()

    };


    try {

        /* =====================================
           7. MISE À JOUR DANS SUPABASE
           ===================================== */

        const savedRows = await api(
            'laser_parameters',
            {
                q:
                    '?id=eq.' +
                    encodeURIComponent(
                        parameter.id
                    ),

                m:
                    'PATCH',

                b:
                    updateData

            }
        );


        /* =====================================
           8. ACTUALISATION DE LA COPIE LOCALE
           ===================================== */

        const savedParameter =
            Array.isArray(savedRows) &&
            savedRows.length

                ? savedRows[0]
                : updateData;


        Object.assign(
            parameter,
            savedParameter
        );


        /* =====================================
           9. HISTORIQUE DES MODIFICATIONS
           ===================================== */

        if (oldPower !== newPower) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'power_percent',
                oldPower,
                newPower
            );

        }


        if (oldSpeed !== newSpeed) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'speed_mm_s',
                oldSpeed,
                newSpeed
            );

        }


        if (oldPasses !== newPasses) {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'passes',
                oldPasses,
                newPasses
            );

        }


        if (oldQuality !== 'validated') {

            await audit(
                'laser_parameters',
                parameter.id,
                'update',
                'quality',
                oldQuality,
                'validated'
            );

        }


        /* =====================================
           10. HISTORIQUE DE CALIBRATION
           Le commentaire reste conservé dans
           Laser_calibrations.
           ===================================== */

        const selectedMachine =
            machines.find(
                machine =>
                    String(machine.id) ===
                    String($('machine').value)
            );


        try {

            await api(
                'Laser_calibrations',
                {
                    m:
                        'POST',

                    b: {

                        material:
                            $('material').value,

                        operation:
                            $('operation').value,

                        machine:
                            selectedMachine
                                ? selectedMachine.name
                                : '',

                        power_percent:
                            newPower,

                        speed_mm_s:
                            newSpeed,

                        passes:
                            newPasses,

                        comments:
                            $('comments').value,

                        created_by_user_id:
                            user?.id || null,

                        created_by_email:
                            user?.email || null

                    }

                }
            );

        } catch (historyError) {

            console.warn(
                'Historique calibration non enregistré',
                historyError
            );

        }


        /* =====================================
           11. RAFRAÎCHISSEMENT IMMÉDIAT
           ===================================== */

        calc();

        await loadCalibs();


        toast(
            TXT[lang].parameterSaved ||
            TXT.fr.parameterSaved
        );

    } catch (error) {

        console.error(
            'saveParameter',
            error
        );

        toast(
            TXT[lang].parameterSaveError ||
            TXT.fr.parameterSaveError
        );

    }

}
      async function loadCalibs() {
        let h = $('calibs');
        h.innerHTML = '';
        try {
          let rows = await api('Laser_calibrations', {
            q: '?select=*&order=created_at.desc&limit=20'
          });
          if (!rows.length) {
            h.innerHTML = '<p>Aucune calibration.</p>';
            return
          }
          rows.forEach(row => {

    const material = materials.find(
        item =>
            item.code === row.material
    );

    const materialLabel =

        material
            ? loc(material, 'name')
            : row.material || '';


    const operationLabel =

        TXT[lang][row.operation] ||

        TXT.fr[row.operation] ||

        row.operation ||

        '';


    const machineLabel =
        row.machine || '';


    const powerLabel =

        row.power_percent !== null &&
        row.power_percent !== undefined

            ? row.power_percent + ' %'
            : '–';


    const speedLabel =

        row.speed_mm_s !== null &&
        row.speed_mm_s !== undefined

            ? row.speed_mm_s + ' mm/s'
            : '–';


    const passesLabel =

        row.passes !== null &&
        row.passes !== undefined

            ? row.passes +
              ' ' +
              (
                  TXT[lang].passesUnit ||
                  TXT.fr.passesUnit
              )

            : '–';


    const item =
        document.createElement('div');


    item.className =
        'item';


    item.innerHTML = `

        <b>
            ${materialLabel}
            ·
            ${operationLabel}
        </b>

        <div class="s">

            ${machineLabel}

            <br>

            ${powerLabel}
            ·
            ${speedLabel}
            ·
            ${passesLabel}

            <br>

            ${row.created_by_email || row.operator || ''}

        </div>

    `;


    if (row.comments) {

        const comments =
            document.createElement('div');

        comments.className =
            'calibration-comments';

        comments.textContent =
            row.comments;

        item.appendChild(
            comments
        );

    }


    $('calibs').appendChild(
        item
    );

});
        } catch (e) {
          h.innerHTML = '<p>Supabase non chargé.</p>'
        }
      }
