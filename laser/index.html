<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laser Calculator</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../auth-guard.js"></script><style>
:root{--bg:#d8d8d3;--card:#eeeeea;--card2:#f6f6f2;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--accent:#1d1d1b;--ok:#237a3b;--warn:#a76b00;--err:#b42318;--soft:#e5e5df;--valid:#d9eadb}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding:18px 18px 42px}.wrap{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.logo{width:76px;height:76px;border:2px solid var(--txt);border-radius:20px;background:#e0e1dd;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #fff}.logo svg{width:54px;height:54px}.title h1{margin:0;font-size:31px}.title p{margin:4px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}.hub-btn,.langs button,.role-pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 14px;color:var(--txt);font-weight:850;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.10)}.role-pill{cursor:default;color:var(--muted)}.langs{display:flex;gap:8px;flex-wrap:wrap}.langs button.active{background:var(--accent);color:white}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.col{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.12)}.card h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:10px;background:var(--accent)}label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin:10px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputline{display:flex;gap:8px;align-items:stretch}select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--txt);font-size:15px}textarea{min-height:78px;resize:vertical}.search-btn,.mini-plus{height:46px;min-width:46px;border-radius:14px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.search-btn{border:1px solid var(--line);background:white;color:var(--txt)}.mini-plus{border:none;background:var(--accent);color:white;display:none}.can-edit .mini-plus{display:flex}.res-big{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:13px;margin:10px 0}.res-big.valid{background:var(--valid);border-color:var(--ok)}.res-big .lbl{font-size:13px;color:var(--muted)}.res-big .val{font-size:30px;font-weight:900;margin-top:3px}.res-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.res-line .k{color:var(--muted)}.note{background:rgba(29,29,27,.06);border-left:4px solid var(--accent);padding:10px;border-radius:12px;margin-top:10px;color:#30302d}.btn{width:100%;border:none;border-radius:13px;background:var(--accent);color:#fff;padding:13px 14px;font-weight:850;font-size:15px;margin-top:10px;cursor:pointer}.btn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.lib{margin-top:14px}.item{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.item .t{font-weight:850}.item .s{color:var(--muted);font-size:13px;margin-top:3px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:11px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:99}.foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9998;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-head h3{margin:0;font-size:20px}.close{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:900}.result{padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin-top:8px;cursor:pointer}.result:hover{background:var(--valid)}@media(max-width:860px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.title h1{font-size:24px}.logo{width:64px;height:64px}.logo svg{width:46px;height:46px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 76 L48 48"/><path d="M48 48 L32 22"/><path d="M48 48 H78"/><path d="M70 48 V76"/><path d="M56 76 H86"/></svg></div><div class="title"><h1 data-t="title">Laser Calculator</h1><p data-t="subtitle">Bibliothèque Supabase matières + opérations + paramètres</p></div></div><div class="top-actions"><button class="hub-btn" onclick="goHub()">🏠 Hub</button><span class="role-pill" id="rolePill">...</span><div class="langs"><button data-lang="fr" onclick="setLang('fr')">French</button><button data-lang="en" onclick="setLang('en')">English</button><button data-lang="pt" onclick="setLang('pt')">Português</button></div></div></div><div class="layout"><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="machineInputs"></span></h2><label data-t="machine"></label><div class="inputline"><select id="machine"></select><button class="search-btn" onclick="searchMachine()">🔍</button><button class="mini-plus" onclick="addMachine()">+</button></div></section><section class="card"><h2><span class="dot"></span><span data-t="materialOperation"></span></h2><label data-t="material"></label><div class="inputline"><select id="material"></select><button class="search-btn" onclick="searchMaterial()">🔍</button><button class="mini-plus" onclick="addMaterial()">+</button></div><label data-t="operation"></label><div class="inputline"><select id="operation"></select><button class="search-btn" onclick="searchParam()">🔍</button><button class="mini-plus" onclick="editParam()">✎</button></div><label data-t="thickness"></label><input id="thickness" type="number" value="3"><div class="note" id="note"></div></section></div><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="quickRead"></span></h2><div class="res-big valid"><div class="lbl" data-t="powerProgram"></div><div class="val"><span id="power">–</span></div></div><div class="res-big"><div class="lbl" data-t="speedProgram"></div><div class="val"><span id="speed">–</span></div></div><div class="res-line"><span class="k" data-t="passes"></span><b id="passes">–</b></div></section><section class="card"><h2><span class="dot"></span><span data-t="calibration"></span></h2><input id="cPower"><input id="cSpeed"><textarea id="comments"></textarea><button class="btn" onclick="saveCalib()" data-t="save"></button></section></div></div><section class="card lib"><h2><span class="dot"></span><span data-t="library"></span></h2><button class="btn secondary" onclick="loadCalibs()" data-t="reload"></button><div id="calibs"></div></section><div class="foot" data-t="foot"></div></div><div class="toast" id="toast"></div><div class="modal" id="searchModal"><div class="modal-panel"><div class="modal-head"><h3 id="searchTitle">Recherche</h3><button class="close" id="searchClose">×</button></div><label>Recherche</label><input id="searchInput" placeholder="Nom, numéro ou référence"><div id="searchResults"></div></div></div><script>const APP='laser';
const SUPABASE_URL='https://erzuvpswagzwlrxgctaj.supabase.co', SUPABASE_KEY='sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let lang=localStorage.getItem(APP+'_lang')||'fr',user=null,role='user';
const canEdit=()=>['expert','admin'].includes(role);
async function token(){return (await sb.auth.getSession()).data.session?.access_token||SUPABASE_KEY}
async function api(table,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(opt.q||''),{method:opt.m||'GET',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:opt.b?JSON.stringify(opt.b):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function goHub(){location.href='/'}
function setLang(l){lang=l;localStorage.setItem(APP+'_lang',l);refreshText()}
function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillLists();calc()}
async function audit(table,record,action,field,oldv,newv){try{await api('library_history',{m:'POST',b:{application:APP,table_name:table,record_id:String(record||''),action,field_name:field||'',old_value:String(oldv||''),new_value:String(newv||''),user_id:user?.id,user_email:user?.email}})}catch(e){console.warn('audit',e)}}
async function initAuth(){await window.authReady;user=await window.appAuth.getUser();role=await window.appAuth.getRole();let rp=$('rolePill');if(rp)rp.textContent=(user?.email||'')+' · '+role;if(canEdit())document.body.classList.add('can-edit')}
function openSearch(title,items,onPick){let m=$('searchModal'),q=$('searchInput'),list=$('searchResults');$('searchTitle').textContent=title;q.value='';function render(){let term=q.value.toLowerCase().trim();let rows=items.filter(x=>!term||x.search.toLowerCase().includes(term)).slice(0,60);list.innerHTML=rows.map((x,i)=>`<div class="result" data-i="${i}"><div class="t"><b>${x.title}</b></div><div class="s">${x.sub||''}</div></div>`).join('')||'<p class="unit">Aucun résultat.</p>';[...list.querySelectorAll('.result')].forEach((el,idx)=>el.onclick=()=>{onPick(rows[idx].value);closeSearch()})}q.oninput=render;$('searchClose').onclick=closeSearch;m.classList.add('open');setTimeout(()=>q.focus(),50);render()}
function closeSearch(){$('searchModal').classList.remove('open')}

const TXT={fr:{title:'Laser Calculator',subtitle:'Bibliothèque Supabase matières + opérations + paramètres',machineInputs:'Machine laser',machine:'Machine',materialOperation:'Matière & opération',material:'Matière',operation:'Opération',thickness:'Épaisseur',quickRead:'Lecture rapide',powerProgram:'Puissance à programmer',speedProgram:'Vitesse à programmer',passes:'Passes',calibration:'Calibration atelier',save:'💾 Enregistrer calibration',library:'Bibliothèque Supabase Laser',reload:'↻ Recharger Supabase',foot:'Les bibliothèques sont lues et modifiées dans Supabase.'},en:{title:'Laser Calculator',subtitle:'Supabase material + operation + parameter library',machineInputs:'Laser machine',machine:'Machine',materialOperation:'Material & operation',material:'Material',operation:'Operation',thickness:'Thickness',quickRead:'Quick read',powerProgram:'Programmed power',speedProgram:'Programmed speed',passes:'Passes',calibration:'Workshop calibration',save:'💾 Save calibration',library:'Laser Supabase library',reload:'↻ Reload Supabase',foot:'Libraries are read and edited in Supabase.'},pt:{title:'Laser Calculator',subtitle:'Biblioteca Supabase de materiais + operações + parâmetros',machineInputs:'Máquina laser',machine:'Máquina',materialOperation:'Material & operação',material:'Material',operation:'Operação',thickness:'Espessura',quickRead:'Leitura rápida',powerProgram:'Potência a programar',speedProgram:'Velocidade a programar',passes:'Passagens',calibration:'Calibração oficina',save:'💾 Guardar calibração',library:'Biblioteca Supabase Laser',reload:'↻ Recarregar Supabase',foot:'As bibliotecas são lidas e modificadas no Supabase.'}};let materials=[],params=[],machines=[];const OPS={cut:'Découpe',engrave:'Gravure',mark:'Marquage',kiss:'Ritsage / mi-chair'};async function loadLibraries(){materials=await api('laser_materials',{q:'?select=*&order=name_fr.asc'});params=await api('laser_parameters',{q:'?select=*&order=material_code.asc'});machines=await api('laser_machines',{q:'?select=*&order=name.asc'});if(!machines.length)machines=[{name:'Générique CO₂ 80W'}]}function loc(r,b){return r[b+'_'+lang]||r[b+'_fr']||r[b]||''}function fillLists(){let sm=$('machine'),vm=sm.value;sm.innerHTML='';machines.forEach(m=>sm.add(new Option(m.name,m.name)));if(vm)sm.value=vm;let mat=$('material'),v=mat.value;mat.innerHTML='';materials.forEach(m=>mat.add(new Option(loc(m,'name'),m.code)));if(materials.find(x=>x.code===v))mat.value=v;let op=$('operation'),vo=op.value;op.innerHTML='';[...new Set(params.filter(p=>p.material_code===$('material').value).map(p=>p.operation))].forEach(o=>op.add(new Option(OPS[o]||o,o)));if([...op.options].some(o=>o.value===vo))op.value=vo}function selectedParam(){return params.find(p=>p.material_code===$('material').value&&p.operation===$('operation').value)}function calc(){let p=selectedParam();if(!p)return;$('power').textContent=(p.power_percent||'–')+' %';$('speed').textContent=(p.speed_mm_s||'–')+' mm/s';$('passes').textContent=p.passes||'–';$('cPower').value=p.power_percent||'';$('cSpeed').value=p.speed_mm_s||'';let m=materials.find(x=>x.code===$('material').value);$('note').textContent=m?m.note||'':''}
function searchMachine(){openSearch('Recherche machine',machines.map(m=>({title:m.name,sub:'Machine Laser',search:m.name,value:m.name})),v=>{$('machine').value=v;calc()})}function searchMaterial(){openSearch('Recherche matière',materials.map(m=>({title:loc(m,'name'),sub:m.code+' · '+(m.family||''),search:[m.code,loc(m,'name'),m.family,m.note].join(' '),value:m.code})),v=>{$('material').value=v;fillLists();calc()})}function searchParam(){openSearch('Recherche paramètre',params.map(p=>({title:(materials.find(m=>m.code===p.material_code)?.name_fr||p.material_code)+' · '+(OPS[p.operation]||p.operation),sub:`${p.power_percent}% · ${p.speed_mm_s} mm/s · ${p.passes} passes`,search:[p.material_code,p.operation,p.power_percent,p.speed_mm_s,p.air_assist].join(' '),value:String(p.id)})),v=>{let p=params.find(x=>String(x.id)===v);if(p){$('material').value=p.material_code;fillLists();$('operation').value=p.operation;calc()}})}
async function editParam(){if(!canEdit()){toast('Droit expert/admin requis');return}let p=selectedParam();if(!p)return;let old=p.power_percent;let power=prompt('Puissance %',p.power_percent);if(power===null)return;let speed=prompt('Vitesse mm/s',p.speed_mm_s);if(speed===null)return;await api('laser_parameters?id=eq.'+p.id,{m:'PATCH',b:{power_percent:+power,speed_mm_s:+speed,updated_by_user_id:user.id,updated_by_email:user.email,updated_at:new Date().toISOString()}});await audit('laser_parameters',p.id,'update','power_percent',old,power);toast('Paramètre modifié dans Supabase');await loadLibraries();refreshText()}async function addMaterial(){if(!canEdit()){toast('Droit expert/admin requis');return}let name=prompt('Nom matière');if(!name)return;let code=name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_');await api('laser_materials',{m:'POST',b:{code,name_fr:name,name_en:name,name_pt:name,created_by_user_id:user.id,created_by_email:user.email}});await audit('laser_materials',code,'insert','name',null,name);toast('Matière ajoutée');await loadLibraries();refreshText()}async function addMachine(){if(!canEdit()){toast('Droit expert/admin requis');return}let name=prompt('Nom machine');if(!name)return;await api('laser_machines',{m:'POST',b:{name,watt:80,speed_max:500}});toast('Machine ajoutée');await loadLibraries();refreshText()}async function saveCalib(){await api('Laser_calibrations',{m:'POST',b:{material:$('material').value,operation:$('operation').value,machine:$('machine').value,thickness_mm:+$('thickness').value,power_percent:+$('cPower').value,speed_mm_s:+$('cSpeed').value,comments:$('comments').value,created_by_user_id:user.id,created_by_email:user.email}});toast('Calibration enregistrée');loadCalibs()}async function loadCalibs(){let h=$('calibs');h.innerHTML='';try{let rows=await api('Laser_calibrations',{q:'?select=*&order=created_at.desc&limit=20'});if(!rows.length){h.innerHTML='<p class="unit">Aucune calibration chargée.</p>';return}rows.forEach(r=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="t">${r.material||''} · ${r.operation||''}</div><div class="s">${r.power_percent||'-'}% · ${r.speed_mm_s||'-'} mm/s<br>${r.created_by_email||r.operator||''}</div>`;h.appendChild(d)})}catch(e){h.innerHTML='<p class="unit">Supabase non chargé.</p>'}}async function init(){await initAuth();await loadLibraries();refreshText();loadCalibs();['machine','material','operation','thickness'].forEach(id=>$(id).addEventListener('input',calc))}init();
</script></body></html>
