<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNC Calculator</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../auth-guard.js"></script><style>
:root{--bg:#d8d8d3;--card:#eeeeea;--card2:#f6f6f2;--line:#8d8d86;--txt:#1d1d1b;--muted:#5f5f58;--accent:#1d1d1b;--ok:#237a3b;--soft:#e5e5df;--valid:#d9eadb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px}.wrap{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.logo{width:76px;height:76px;border:2px solid var(--txt);border-radius:20px;background:#e0e1dd;display:grid;place-items:center}.logo svg{width:54px;height:54px}.title h1{margin:0;font-size:31px}.title p{margin:4px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hub-btn,.langs button,.role-pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 14px;color:var(--txt);font-weight:850;text-decoration:none}.langs button.active{background:var(--accent);color:white}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.12)}h2{display:flex;gap:8px;margin:0 0 12px;font-size:18px}.dot{width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--accent)}label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin:10px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputline{display:flex;gap:8px;align-items:stretch}select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--txt);font-size:15px}textarea{min-height:78px}.search-btn,.mini-plus{height:46px;min-width:46px;border-radius:14px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.search-btn{border:1px solid var(--line);background:white}.mini-plus{border:none;background:var(--accent);color:white;display:none}.can-edit .mini-plus{display:flex}.res-big{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:13px;margin:10px 0}.res-big.valid{background:var(--valid);border-color:var(--ok)}.res-big .lbl{font-size:13px;color:var(--muted)}.res-big .val{font-size:30px;font-weight:900}.res-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.note{background:rgba(29,29,27,.06);border-left:4px solid var(--accent);padding:10px;border-radius:12px;margin-top:10px}.btn{width:100%;border:none;border-radius:13px;background:var(--accent);color:white;padding:13px;margin-top:10px;font-weight:850}.btn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.lib{margin-top:14px}.item{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.item .s{color:var(--muted);font-size:13px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1b;color:white;padding:11px 14px;border-radius:999px;display:none;z-index:99}.foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9998;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}.modal-head{display:flex;justify-content:space-between}.close{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:900}.result{padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin-top:8px;cursor:pointer}.result:hover{background:var(--valid)}@media(max-width:860px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.title h1{font-size:24px}.logo{width:64px;height:64px}.logo svg{width:46px;height:46px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 70 A35 35 0 0 1 80 35"/><path d="M40 40 L72 72"/><path d="M72 72 H86"/><path d="M72 72 V86"/></svg></div><div class="title"><h1 data-t="title">CNC Calculator</h1><p data-t="subtitle">Bibliothèque CNC synchronisée avec Excel V3</p></div></div><div class="top-actions"><button class="hub-btn" onclick="goHub()">🏠 Hub</button><span class="role-pill" id="rolePill">...</span><div class="langs"><button data-lang="fr" onclick="setLang('fr')">French</button><button data-lang="en" onclick="setLang('en')">English</button><button data-lang="pt" onclick="setLang('pt')">Português</button></div></div></div><div class="layout"><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="machineInputs"></span></h2><label data-t="machine"></label><div class="inputline"><select id="machine"></select><button class="search-btn" onclick="searchMachine()">🔍</button><button class="mini-plus" onclick="addMachine()">+</button></div></section><section class="card"><h2><span class="dot"></span><span data-t="toolInputs"></span></h2><label data-t="material"></label><div class="inputline"><select id="material"></select><button class="search-btn" onclick="searchMaterial()">🔍</button><button class="mini-plus" onclick="addMaterial()">+</button></div><label data-t="tool"></label><div class="inputline"><select id="tool"></select><button class="search-btn" onclick="searchTool()">🔍</button><button class="mini-plus" onclick="editTool()">✎</button></div><div class="row"><div><label data-t="diameter"></label><input id="diameter" type="number" value="12" step="0.1"></div><div><label data-t="flutes"></label><input id="flutes" type="number" value="2"></div></div><div class="note" id="note"></div></section></div><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="quickRead"></span></h2><div class="res-big valid"><div class="lbl" data-t="spindle"></div><div class="val"><span id="rpm">–</span></div></div><div class="res-big"><div class="lbl" data-t="feed"></div><div class="val"><span id="feed">–</span></div></div><div class="res-line"><span>Vc min/rec/max</span><b id="vc">–</b></div><div class="res-line"><span>Fz min/rec/max</span><b id="fz">–</b></div><div class="res-line"><span>Passe</span><b id="pass">–</b></div><div class="res-line"><span>Engagement</span><b id="eng">–</b></div></section><section class="card"><h2><span class="dot"></span><span data-t="calibration"></span></h2><div class="row"><input id="cRpm"><input id="cFeed"></div><textarea id="comments"></textarea><button class="btn" onclick="saveCalib()" data-t="save"></button></section></div></div><section class="card lib"><h2><span class="dot"></span><span data-t="library"></span></h2><button class="btn secondary" onclick="loadCalibs()" data-t="reload"></button><div id="calibs"></div></section><div class="foot" data-t="foot"></div></div><div class="toast" id="toast"></div><div class="modal" id="searchModal"><div class="modal-panel"><div class="modal-head"><h3 id="searchTitle">Recherche</h3><button class="close" id="searchClose">×</button></div><label>Recherche</label><input id="searchInput" placeholder="Nom, numéro ou référence"><div id="searchResults"></div></div></div><script>const APP='cnc';
const SUPABASE_URL='https://erzuvpswagzwlrxgctaj.supabase.co', SUPABASE_KEY='sb_publishable_EERLI2l3AjQWkCLsMK3kbA_DMny2RFr';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let lang=localStorage.getItem(APP+'_lang')||'fr',user=null,role='user';const canEdit=()=>['expert','admin'].includes(role);async function token(){return (await sb.auth.getSession()).data.session?.access_token||SUPABASE_KEY}async function api(table,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(opt.q||''),{method:opt.m||'GET',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:opt.b?JSON.stringify(opt.b):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function goHub(){location.href='/'}function setLang(l){lang=l;localStorage.setItem(APP+'_lang',l);refreshText()}function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillLists();calc()}async function initAuth(){await window.authReady;user=await window.appAuth.getUser();role=await window.appAuth.getRole();let rp=$('rolePill');if(rp)rp.textContent=(user?.email||'')+' · '+role;if(canEdit())document.body.classList.add('can-edit')}function openSearch(title,items,onPick){let m=$('searchModal'),q=$('searchInput'),list=$('searchResults');$('searchTitle').textContent=title;q.value='';function render(){let term=q.value.toLowerCase().trim();let rows=items.filter(x=>!term||x.search.toLowerCase().includes(term)).slice(0,80);list.innerHTML=rows.map(x=>`<div class="result"><b>${x.title}</b><div class="s">${x.sub||''}</div></div>`).join('')||'<p>Aucun résultat.</p>';[...list.children].forEach((el,i)=>el.onclick=()=>{onPick(rows[i].value);closeSearch()})}q.oninput=render;$('searchClose').onclick=closeSearch;m.classList.add('open');setTimeout(()=>q.focus(),50);render()}function closeSearch(){$('searchModal').classList.remove('open')}
const TXT={fr:{title:'CNC Calculator',subtitle:'Bibliothèque CNC synchronisée avec Excel V3',machineInputs:'Entrées machine',toolInputs:'Entrées outil & opération',machine:'Machine',material:'Matière',tool:'Type de fraise / outil',diameter:'Diamètre fraise',flutes:'Nombre de dents Z',quickRead:'Lecture rapide',spindle:'Rotation à programmer',feed:'Avance à programmer',calibration:'Calibration atelier',save:'💾 Enregistrer calibration',library:'Bibliothèque Supabase CNC',reload:'↻ Recharger Supabase',foot:'Bibliothèque CNC issue du fichier Excel V3 corrigé.'},en:{title:'CNC Calculator',subtitle:'CNC library synced with Excel V3',machineInputs:'Machine inputs',toolInputs:'Tool & operation inputs',machine:'Machine',material:'Material',tool:'Tool type',diameter:'Tool diameter',flutes:'Flutes Z',quickRead:'Quick read',spindle:'Programmed spindle speed',feed:'Programmed feed rate',calibration:'Workshop calibration',save:'💾 Save calibration',library:'CNC Supabase library',reload:'↻ Reload Supabase',foot:'CNC library from Excel V3.'},pt:{title:'CNC Calculator',subtitle:'Biblioteca CNC sincronizada com Excel V3',machineInputs:'Entradas da máquina',toolInputs:'Ferramenta & operação',machine:'Máquina',material:'Material',tool:'Tipo de ferramenta',diameter:'Diâmetro',flutes:'Dentes Z',quickRead:'Leitura rápida',spindle:'Rotação a programar',feed:'Avanço a programar',calibration:'Calibração oficina',save:'💾 Guardar calibração',library:'Biblioteca CNC Supabase',reload:'↻ Recarregar Supabase',foot:'Biblioteca CNC do Excel V3.'}};let materials=[],tools=[],machines=[];function loc(r,b){return r[b+'_'+lang]||r[b+'_fr']||r[b]||''}async function loadLibraries(){materials=await api('cnc_materials',{q:'?select=*&order=name_fr.asc'});tools=await api('cnc_tools',{q:'?select=*&order=label_fr.asc'});machines=await api('cnc_machines',{q:'?select=*&order=name.asc'});if(!machines.length)machines=[{name:'Générique',n_max:24000,vf_max:3000}]}function fillLists(){let sm=$('machine'),vm=sm.value;sm.innerHTML='';machines.forEach(m=>sm.add(new Option(m.name,m.name)));if(vm)sm.value=vm;let mat=$('material'),v=mat.value;mat.innerHTML='';materials.forEach(m=>mat.add(new Option(loc(m,'name'),m.code)));if(materials.find(x=>x.code===v))mat.value=v;let tool=$('tool'),tv=tool.value;tool.innerHTML='';tools.filter(t=>t.material_code===$('material').value).forEach(t=>tool.add(new Option(loc(t,'label'),t.id)));if([...tool.options].some(o=>o.value===tv))tool.value=tv}function selectedTool(){return tools.find(t=>String(t.id)===$('tool').value)||tools.find(t=>t.material_code===$('material').value)}function mmRange(a,b,d){if(a==null||b==null)return '–';return 'entre '+(a*d).toFixed(1).replace('.',',')+' et '+(b*d).toFixed(1).replace('.',',')+' mm'}function calc(){let t=selectedTool(),ma=machines.find(m=>m.name===$('machine').value)||machines[0],d=+$('diameter').value||12,z=+$('flutes').value||2;if(!t){$('rpm').textContent='–';return}let rpm=Math.round(Math.min((+t.vc_rec||180)*1000/(Math.PI*d),+ma.n_max||24000));let feed=Math.round(Math.min(rpm*z*(+t.fz_rec||.04),+ma.vf_max||3000));$('rpm').textContent=rpm+' tr/min';$('feed').textContent=feed+' mm/min';$('vc').textContent=`${t.vc_min||'–'} / ${t.vc_rec||'–'} / ${t.vc_max||'–'} m/min`;$('fz').textContent=`${t.fz_min||'–'} / ${t.fz_rec||'–'} / ${t.fz_max||'–'} mm/dent`;$('pass').textContent=t.passe_txt||mmRange(+t.pass_min_coef,+t.pass_max_coef,d);$('eng').textContent=t.engagement_txt||mmRange(+t.engagement_min_coef,+t.engagement_max_coef,d);$('cRpm').value=rpm;$('cFeed').value=feed;let m=materials.find(x=>x.code===$('material').value);$('note').textContent=(t.remark_fr||'')+' '+(m?(loc(m,'remark')||''):'')}function searchMachine(){openSearch('Recherche machine',machines.map(m=>({title:m.name,sub:'Machine CNC',search:m.name,value:m.name})),v=>{$('machine').value=v;calc()})}function searchMaterial(){openSearch('Recherche matière',materials.map(m=>({title:loc(m,'name'),sub:m.code+' · '+(loc(m,'family')||''),search:[m.code,loc(m,'name'),loc(m,'family'),loc(m,'remark')].join(' '),value:m.code})),v=>{$('material').value=v;fillLists();calc()})}function searchTool(){openSearch('Recherche outil',tools.map(t=>({title:loc(t,'label'),sub:t.material_code+' · Vc '+(t.vc_rec||'')+' · Fz '+(t.fz_rec||''),search:[t.tool_code,loc(t,'label'),loc(t,'usage'),t.material_code,t.remark_fr].join(' '),value:String(t.id)})),v=>{let t=tools.find(x=>String(x.id)===v);if(t){$('material').value=t.material_code;fillLists();$('tool').value=v;calc()}})}async function editTool(){toast(canEdit()?'Édition paramètre à faire dans Supabase ou prochaine itération':'Droit expert/admin requis')}async function addMaterial(){toast(canEdit()?'Ajout matière à faire dans Supabase ou prochaine itération':'Droit expert/admin requis')}async function addMachine(){toast(canEdit()?'Ajout machine à faire dans Supabase ou prochaine itération':'Droit expert/admin requis')}async function saveCalib(){await api('cnc_calibrations',{m:'POST',b:{material:$('material').value,tool:$('tool').value,machine:$('machine').value,spindle_rpm:+$('cRpm').value,feed_rate:+$('cFeed').value,comments:$('comments').value,created_by_user_id:user.id,created_by_email:user.email}});toast('Calibration enregistrée');loadCalibs()}async function loadCalibs(){let h=$('calibs');h.innerHTML='';try{let rows=await api('cnc_calibrations',{q:'?select=*&order=created_at.desc&limit=20'});if(!rows.length){h.innerHTML='<p>Aucune calibration.</p>';return}rows.forEach(r=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${r.material||''} · ${r.tool||''}</b><div class="s">${r.machine||''} · ${r.spindle_rpm||'-'} tr/min · ${r.feed_rate||'-'} mm/min<br>${r.created_by_email||r.operator||''}</div>`;h.appendChild(d)})}catch(e){h.innerHTML='<p>Supabase non chargé.</p>'}}async function init(){await initAuth();await loadLibraries();refreshText();loadCalibs();['machine','material','tool','diameter','flutes'].forEach(id=>$(id).addEventListener('input',calc))}init();
</script></body></html>
