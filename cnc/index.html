iv><div class="row"><div><label data-t="diameter"></label><div class="inputline"><input id="diameter" type="number" value="3" step="0.1"><span class="unit">mm</span></div></div><div><label data-t="flutes"></label><input id="flutes" type="number" value="1" step="1"></div></div><label data-t="operation"></label><select id="operation"><option value="contour">Contournage</option><option value="pocket">Poche</option><option value="drill">Perçage</option></select><div class="note" id="cncNote"></div></section></div><div class="col"><section class="card"><h2><span class="dot"></span><span data-t="quickRead"></span></h2><div class="res-big valid"><div class="lbl" data-t="spindle"></div><div class="val"><span id="rpm">–</span><span class="unit"> tr/min</span></div></div><div class="res-big"><div class="lbl" data-t="feed"></div><div class="val"><span id="feed">–</span><span class="unit"> mm/min</span></div></div><div class="res-line"><span class="k">Vc</span><b id="rVc">–</b></div><div class="res-line"><span class="k">Fz</span><b id="rFz">–</b></div><div class="res-line"><span class="k" data-t="pass"></span><b id="rPass">–</b></div><span id="cncBadge" class="badge ok">OK</span></section><section class="card"><h2><span class="dot"></span><span data-t="calibration"></span></h2><div class="row"><div><label data-t="validRpm"></label><input id="cRpm" type="number"></div><div><label data-t="validFeed"></label><input id="cFeed" type="number"></div></div><div class="row"><div><label data-t="validPass"></label><input id="cPass" type="number" step="0.1"></div><div><label data-t="validEng"></label><input id="cEng" type="number" step="0.1"></div></div><label data-t="comments"></label><textarea id="comments"></textarea><button class="btn" onclick="saveCalib()" data-t="save"></button><button class="btn secondary" onclick="fillCalib()" data-t="useCalc"></button></section></div></div><section class="card lib"><h2><span class="dot"></span><span data-t="library"></span></h2><button class="btn const TXT={fr:{title:'CNC Calculator',subtitle:'Matières + outils + vitesses / avances / calibrations',machineInputs:'Entrées machine',toolInputs:'Entrées outil & opération',machine:'Machine',nMax:'n max machine',vfMax:'Vf max machine',marginN:'Marge sécurité n',marginVf:'Marge sécurité Vf',material:'Matière',tool:'Type de fraise / outil',diameter:'Diamètre fraise',flutes:'Nombre de dents Z',operation:'Opération',quickRead:'Lecture rapide',spindle:'Rotation à programmer',feed:'Avance à programmer',pass:'Passe recommandée',calibration:'Calibration atelier',validRpm:'n réel validé',validFeed:'Vf réel validé',validPass:'Passe validée',validEng:'Engagement validé',comments:'Remarque',save:'💾 Enregistrer comme réglage validé',useCalc:'⤵ Reprendre valeurs calculées',library:'Bibliothèque Supabase CNC',reload:'↻ Recharger Supabase',foot:'CNC Calculator · réglages indicatifs à valider sur chute matière avant production.'},en:{title:'CNC Calculator',subtitle:'Materials + tools + speeds / feeds / calibrations',machineInputs:'Machine inputs',toolInputs:'Tool & operation inputs',machine:'Machine',nMax:'Machine max rpm',vfMax:'Machine max feed',marginN:'RPM safety margin',marginVf:'Feed safety margin',material:'Material',tool:'Cutter / tool type',diameter:'Cutter diameter',flutes:'Flutes Z',operation:'Operation',quickRead:'Quick read',spindle:'Programmed spindle speed',feed:'Programmed feed rate',pass:'Recommended pass',calibration:'Workshop calibration',validRpm:'Validated rpm',validFeed:'Validated feed',validPass:'Validated pass',validEng:'Validated engagement',comments:'Notes',save:'💾 Save as validated setting',useCalc:'⤵ Use calculated values',library:'CNC Supabase library',reload:'↻ Reload Supabase',foot:'CNC Calculator · indicative settings to validate on scrap before production.'},pt:{title:'CNC Calculator',subtitle:'Materiais + ferramentas + velocidades / avanços / calibrações',machineInputs:'Entradas da máquina',toolInputs:'Ferramenta & operação',machine:'Máquina',nMax:'rpm máx. da máquina',vfMax:'Avanço máx. da máquina',marginN:'Margem segurança rpm',marginVf:'Margem segurança avanço',material:'Material',tool:'Tipo de fresa / ferramenta',diameter:'Diâmetro da fresa',flutes:'Nº de dentes Z',operation:'Operação',quickRead:'Leitura rápida',spindle:'Rotação a programar',feed:'Avanço a programar',pass:'Passe recomendado',calibration:'Calibração oficina',validRpm:'rpm validado',validFeed:'Avanço validado',validPass:'Passe validado',validEng:'Engajamento validado',comments:'Observação',save:'💾 Guardar como ajuste validado',useCalc:'⤵ Usar valores calculados',library:'Biblioteca Supabase CNC',reload:'↻ Recarregar Supabase',foot:'CNC Calculator · parâmetros indicativos a validar em amostra antes da produção.'}};
let machines=[{name:'Générique',n_max:24000,vf_max:3000,safety_n:.95,safety_vf:.90},{name:'BIESSE',n_max:24000,vf_max:30000,safety_n:.95,safety_vf:.90}];let materials={pmma:{n:{fr:'PMMA / acrylique',en:'PMMA / acrylic',pt:'PMMA / acrílico'},note:{fr:'Usinage propre, éviter la fonte.',en:'Clean machining, avoid melting.',pt:'Maquinação limpa, evitar fusão.'},tools:{up:{n:{fr:'Hélicoïdale montante / upcut',en:'Upcut spiral',pt:'Helicoidal ascendente'},vc:220,fz:.045,pass:.8},comp:{n:{fr:'Compression',en:'Compression',pt:'Compressão'},vc:180,fz:.04,pass:.6}}},mdf:{n:{fr:'MDF / HMR board',en:'MDF / HMR board',pt:'MDF / HMR board'},note:{fr:'Bonne aspiration nécessaire.',en:'Good extraction required.',pt:'Boa aspiração necessária.'},tools:{up:{n:{fr:'Hélicoïdale montante / upcut',en:'Upcut spiral',pt:'Helicoidal ascendente'},vc:250,fz:.07,pass:1.2}}}};let q=(s,o={})=>fetch(SUPABASE_URL+'/rest/v1/'+s+(o.q||''),{method:o.m||'GET',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:o.b?JSON.stringify(o.b):undefined}).then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()});
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)} function goHub(){location.href='/'} function setLang(l){lang=l;localStorage.setItem('cnc_lang',l);refreshText()} function refreshText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TXT[lang][e.dataset.t]||TXT.fr[e.dataset.t]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));fillMachines();fillMaterials();calc()} function fillMachines(){let s=$('machine'),v=s.value;s.innerHTML='';machines.forEach(m=>s.add(new Option(m.name,m.name)));if(v)s.value=v}function fillMaterials(){let s=$('material'),v=s.value;s.innerHTML='';Object.entries(materials).forEach(([k,m])=>s.add(new Option(m.n[lang],k)));if(materials[v])s.value=v;fillTools()}function fillTools(){let s=$('tool'),v=s.value,m=materials[$('material').value];s.innerHTML='';Object.entries(m.tools).forEach(([k,t])=>s.add(new Option(t.n[lang],k)));if(m.tools[v])s.value=v}
function calc(){let m=materials[$('material').value],t=m.tools[$('tool').value],d=+$('diameter').value||3,z=+$('flutes').value||1,ma=machines.find(x=>x.name===$('machine').value)||machines[0];let rpm=Math.round(Math.min(t.vc*1000/(Math.PI*d),ma.n_max*(+$('marginN').value||.95)));let feed=Math.round(Math.min(rpm*z*t.fz,ma.vf_max*(+$('marginVf').value||.9)));$('rpm').textContent=rpm;$('feed').textContent=feed;$('rVc').textContent=t.vc+' m/min';$('rFz').textContent=t.fz+' mm/dent';$('rPass').textContent=t.pass+' mm';$('cncNote').textContent=m.note[lang];$('cRpm').value=rpm;$('cFeed').value=feed;$('cPass').value=t.pass;$('cEng').value=(d*.4).toFixed(1)}
async function addMachine(){let name=prompt('Nom machine','Nouvelle machine');if(!name)return;let row={name:name.trim(),n_max:+prompt('n max',24000),vf_max:+prompt('Vf max',3000),safety_n:.95,safety_vf:.9};try{let a=await q('cnc_machines',{m:'POST',b:row});machines.push(a[0]);refreshText();$('machine').value=a[0].name;toast('Machine ajoutée')}catch(e){toast('Erreur machine')}}function addMaterial(){toast('Ajout matière: utiliser Supabase ou prochaine version')}function addTool(){toast('Ajout outil: utiliser Supabase ou prochaine version')}function fillCalib(){calc()}async function saveCalib(){try{await q('CNC_calibrations',{m:'POST',b:{material:$('material').value,tool:$('tool').value,machine:$('machine').value,operation:$('operation').value,spindle_rpm:+$('cRpm').value,feed_rate:+$('cFeed').value,comments:$('comments').value}});toast('Calibration enregistrée');loadCalibs()}catch(e){toast('Erreur Supabase')}}async function loadCalibs(){let host=$('calibs');host.innerHTML='';try{let rows=await q('CNC_calibrations',{q:'?select=*&order=created_at.desc&limit=20'});if(!rows.length){host.innerHTML='<p class="unit">Aucune calibration chargée.</p>';return}rows.forEach(r=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="t">${r.material||''} · ${r.tool||''}</div><div class="s">${r.machine||''} · ${r.spindle_rpm||'-'} tr/min · ${r.feed_rate||'-'} mm/min</div>`;host.appendChild(d)})}catch(e){host.innerHTML='<p class="unit">Supabase non chargé.</p>'}}
['nMax','vfMax','marginN','marginVf','diameter','flutes','material','tool','machine','operation'].forEach(id=>$(id).addEventListener('input',calc));refreshText();loadCalibs();
